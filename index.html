<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpa Cifrada — Biblioteca v23</title>
<style>

:root{
  --bg:#f2eee7;
  --paper:#fffdf9;
  --ink:#25221e;
  --muted:#746e64;
  --accent:#7a4a24;
  --line:#ddd5ca;
  --key:#f8f5ef;
  --key-hover:#ece5da;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
}

.ocultado{
  display:none!important;
}


/* =========================
   BARRA SUPERIOR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:transparent;
  border-bottom:1px solid var(--line);
  box-shadow:0 3px 14px rgba(60,45,30,.06);
  backdrop-filter:none;
}

.toolbar{
  width:min(1500px,100%);
  margin:0 auto;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  background:rgba(255,253,249,.96);
}

button{
  border:1px solid #cec4b7;
  background:var(--key);
  color:var(--ink);
  border-radius:8px;
  padding:8px 9px;
  min-height:34px;
  cursor:pointer;
  font:600 .79rem/1 Arial,sans-serif;
  transition:background .12s,transform .12s,border-color .12s;
}

button:hover,
button:focus-visible{
  background:var(--key-hover);
  transform:translateY(-1px);
  outline:2px solid rgba(184,135,81,.25);
  outline-offset:1px;
}

button:disabled{
  opacity:.38;
  cursor:default;
  transform:none;
}

button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.action{
  padding-inline:10px;
}

.tone-memory-check{
  display:flex;
  align-items:center;
  gap:3px;
  flex:0 0 auto;
  margin-left:2px;
  cursor:pointer;
  user-select:none;
  font:700 .78rem/1 Arial,sans-serif;
  color:var(--ink);
}

.tone-memory-check input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
  cursor:pointer;
}


/* =========================
   ROLAGEM AUTOMÁTICA
========================= */

.auto-scroll-panel{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:6px 12px 8px;
  border-top:1px solid var(--line);
  background:rgba(255,253,249,.98);
}

.auto-scroll-panel.hidden{
  display:none;
}

.auto-scroll-panel.fade-50{                   /*TRANSPARENCIA NA PLACA DE ROLAGEM*/
  background:rgba(255,253,249,.10);
}

.auto-scroll-panel.fade-50 button{
  background:rgba(248,245,239,.50);
  border-color:rgba(206,196,183,.20);
}

.auto-scroll-panel.fade-50 button:hover,
.auto-scroll-panel.fade-50 button:focus-visible{
  background:rgba(236,229,218,.30);
}

.auto-scroll-panel.fade-50 .auto-scroll-speed{
  opacity:.2;
}

.auto-scroll-panel.fade-50 .memory-check,
.auto-scroll-panel.fade-50 .auto-scroll-value,
.auto-scroll-panel.fade-50 .auto-scroll-label{
  opacity:.20;
}

.auto-scroll-panel .memory-check{
  display:flex;
  align-items:center;
  gap:3px;
  font:700 .78rem/1 Arial,sans-serif;
  cursor:pointer;
  user-select:none;
}

.auto-scroll-panel .memory-check input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
}

.auto-scroll-panel .speed-btn{
  min-width:30px;
  min-height:30px;
  padding:4px 8px;
  border-radius:7px;
}

.auto-scroll-speed{
  width:min(220px,42vw);
  accent-color:var(--accent);
  cursor:pointer;
}

.auto-scroll-value{
  min-width:22px;
  text-align:center;
  font:700 .76rem/1 Arial,sans-serif;
  color:var(--muted);
}

.auto-scroll-label{
  margin-left:4px;
  font:600 .72rem/1 Arial,sans-serif;
  color:var(--muted);
  white-space:nowrap;
}


/* =========================
   MÚSICA ATUAL / TOM
========================= */

.current-song{
  min-width:0;
  max-width:320px;
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 1 auto;
  font:600 .82rem/1.1 Arial,sans-serif;
  color:var(--muted);
}

.current-song strong{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--ink);
}

.tone-pill{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
  font:600 .78rem/1 Arial,sans-serif;
  white-space:nowrap;
  color:var(--muted);
}

.tone-pill strong{
  color:var(--accent);
  background:#f0e7da;
  border:1px solid #d8c4ad;
  border-radius:999px;
  padding:6px 9px;
  font-size:.84rem;
}

.tone-panel{
  width:min(1500px,100%);
  margin:0 auto;
  padding:0 14px 7px;
  display:flex;
  align-items:center;
  gap:2px;
  overflow-x:auto;
  overflow-y:hidden;
  max-height:65px;
  opacity:1;
  transition:max-height .2s,opacity .15s,padding .2s;
  background:rgba(255,253,249,.96);
}

.tone-panel.hidden{
  max-height:0;
  opacity:0;
  padding-top:0;
  padding-bottom:0;
  pointer-events:none;
}

.tone-panel button{
  min-width:35px;
  padding:6px 5px;
}


/* =========================
   BIBLIOTECA
========================= */

.library-backdrop{
  position:fixed;
  inset:0;
  background:rgba(35,29,23,.22);
  z-index:28;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
}

.library-backdrop.open{
  opacity:1;
  pointer-events:auto;
}

.library-drawer{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(360px,92vw);
  background:rgba(255,253,249,.99);
  border-right:1px solid var(--line);
  box-shadow:10px 0 35px rgba(50,40,30,.16);
  z-index:30;
  transform:translateX(-102%);
  transition:transform .2s;
  display:flex;
  flex-direction:column;
}

.library-drawer.open{
  transform:translateX(0);
}

.library-head{
  padding:18px 18px 12px;
  border-bottom:1px solid var(--line);
}

.library-head-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.library-options{
  display:flex;
  align-items:center;
  gap:10px;
  margin-left:auto;
}

.library-check{
  display:flex;
  align-items:center;
  gap:3px;
  font:700 .78rem/1 Arial,sans-serif;
  cursor:pointer;
  user-select:none;
}

.library-check input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
}

.library-title{
  font:700 1.05rem/1 Arial,sans-serif;
  letter-spacing:.03em;
}

.library-close{
  min-width:38px;
}

.library-search{
  width:100%;
  border:1px solid #cfc6b9;
  background:#fffdf9;
  color:var(--ink);
  border-radius:9px;
  padding:10px 11px;
  font:500 .9rem/1.2 Arial,sans-serif;
  outline:none;
}

.library-search:focus{
  border-color:var(--accent);
}

.library-tools{
  display:flex;
  gap:7px;
  padding:10px 18px 8px;
  border-bottom:1px solid var(--line);
}

.library-tools button{
  flex:1;
}

.library-list{
  overflow:auto;
  padding:8px 8px 18px;
}

.library-section-label{
  padding:12px 10px 7px;
  font:700 .74rem/1 Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--accent);
}

.song-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) 40px;
  align-items:center;
  gap:6px;
  margin:2px 0;
  border:1px solid transparent;
  background:transparent;
  border-radius:9px;
}

.song-item.active{
  background:#efe5d8;
  border-color:#dcc6ad;
}

.song-open{
  display:grid;
  grid-template-columns:44px minmax(0,1fr);
  align-items:center;
  gap:8px;
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:10px 8px;
  border-radius:9px;
  transform:none!important;
}

.song-open:hover{
  background:#f6f1e9;
}

.song-number{
  font:700 .82rem/1 Arial,sans-serif;
  color:var(--muted);
}

.song-name{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font:600 .92rem/1.2 Arial,sans-serif;
}

.song-fav{
  min-width:34px;
  padding:7px 5px;
  color:#8d6b2f;
  border-color:transparent;
  background:transparent;
  font-size:1rem;
  transform:none!important;
}

.library-empty{
  padding:20px 12px;
  color:var(--muted);
  font:500 .9rem/1.4 Arial,sans-serif;
}


/* =========================
   PARTITURA / LETRA
========================= */

.score{
  --font-scale:.80;
  width:min(1500px,100%);
  margin:0 auto;
  padding:16px clamp(14px,3vw,44px) 48px;
}

.stanza{
  margin:0 0 7px;
}

.score.section-markers-hidden .verse-title{
  display:none;
}

.stanza.chorus-section{
  font-style:italic;
  font-weight:700;
}

.stanza.chorus-section .verse-title,
.stanza.chorus-section .music-line,
.stanza.chorus-section .aligned-line,
.stanza.chorus-section .plain-segment,
.stanza.chorus-section .chord-group,
.stanza.chorus-section .chord-text,
.stanza.chorus-section .lyrics-inline{
  font-style:italic;
  font-weight:700;
}

.verse-title{
  font:700 .76rem/1 Arial,sans-serif;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.11em;
  margin:0 0 0px;
}

.music-line{
  margin:0 0 0px;
  padding-left:0;
}

.stanza > .verse-title + .music-line{
  padding-left:3px;                    /* RECUO DA PRIMEIRA LINHA DE CADA ESTROFE */
}

.stanza.chorus-section > .verse-title + .music-line{
  padding-left:0;                      /* CORO SEM RECUO */
}

/* =========================
   CIFRAS ALINHADAS
========================= */

.aligned-wrap{
  position:relative;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
}

.overflow-chord-indicator{
  position:absolute;
  right:2px;
  top:0px;
  z-index:5;
  display:none;
  align-items:center;
  gap:2px;
  padding:0px 5px 0px 7px;
  border:1px solid #d8c4ad;
  border-radius:6px;
  background:rgba(255,253,249,.50);
  color:#b00000;
  font:800 calc(clamp(.80rem,1.08vw,.95rem)*var(--font-scale))/1 'Courier New',monospace;
  white-space:nowrap;
  box-shadow:-5px 0 8px rgba(255,253,249,.95);
  pointer-events:none;
}

.overflow-chord-indicator::after{
  content:'>';
  color:var(--ink);
  font-weight:900;
}

.aligned-line{
  display:flex;
  align-items:flex-end;
  width:max-content;
  min-width:100%;
  white-space:nowrap;
  font-size:calc(clamp(1.12rem,2vw,1.42rem)*var(--font-scale));
  line-height:1.27;
  padding-top:1.20em;
  overflow:visible;
}

.plain-segment{
  display:inline-block;
  align-self:flex-end;
  flex:0 0 auto;
  line-height:inherit;
  white-space:pre;
}

.chord-group{
  position:relative;
  display:inline-block;
  align-self:flex-end;
  flex:0 0 auto;
  line-height:inherit;
  white-space:pre;
}


/* =========================
   CIFRAS
========================= */

.chord-label{
  position:absolute;
  left:0;
  bottom:100%;
  display:block;
  height:auto;

  color:#b00000;

  font-family:Arial,Helvetica,sans-serif;
  font-size:calc(clamp(.80rem,1.08vw,.95rem)*var(--font-scale));
  font-weight:900;
  line-height:1;

  white-space:nowrap;
  pointer-events:none;
}

.chord-text{
  display:block;
  line-height:inherit;
  white-space:pre;
}


/* =========================
   MODO INLINE
========================= */

.lyrics-inline{
  font-size:calc(clamp(1.12rem,2vw,1.42rem)*var(--font-scale));
  line-height:1.30;
  letter-spacing:.005em;
  max-width:1100px;
  white-space:pre-wrap;
}

.inline-chord{
  color:#c00000;
  font-weight:800;
  font-size:.78em;
  white-space:nowrap;
  vertical-align:baseline;
}


/* =========================
   CELULAR
========================= */

@media(max-width:760px){

  .toolbar{
    padding:7px 8px;
    gap:4px;
  }

  .current-song{
    order:50;
    max-width:none;
    flex:1 1 100%;
    padding:0 2px 2px;
  }

  .tone-pill{
    margin-left:3px;
  }

  .score{
    padding:14px 10px 38px;
  }

  .aligned-line{
    font-size:calc(1.08rem*var(--font-scale));
    line-height:1.24;
    padding-top:1.16em;
  }

  .chord-label{
    font-size:calc(.80rem*var(--font-scale));
    font-weight:900;
  }

  .lyrics-inline{
    font-size:calc(1.08rem*var(--font-scale));
    line-height:1.26;
  }

  .tone-panel{
    padding-left:8px;
    padding-right:8px;
  }

  .tone-panel button{
    min-width:34px;
    padding:5px 4px;
  }

}

</style><span></span></label>
</head>
<body>
<header class="topbar">
<div class="toolbar" aria-label="Controles">

  <button class="action" id="openLibrary" title="Biblioteca">☰</button>

  <div class="current-song" id="currentSongLabel">
    <strong>001 — Chuvas de Graça</strong>
    <label class="tone-memory-check" title="Memorizar o tom desta música">
      <input type="checkbox" id="toneMemory">
    </label>
  </div>

  <button class="action" id="down" title="Descer 1 semitom">−½</button>
  <button class="action" id="up" title="Subir 1 semitom">+½</button>
  <button class="action" id="reset" title="Tom original">↺</button>

  <button class="action" id="fontDown" title="Diminuir fonte">−</button>
  <button class="action" id="fontUp" title="Aumentar fonte">+</button>

  <button class="action" id="toggleSections" title="Ocultar marcações">🎵</button>
  <button class="action" id="toggleNotes" title="Mostrar/ocultar tons">🔺</button>

  <button class="action" id="toggleProgression" title="Progressão numérica">#</button>
  <button class="action" id="toggleInline" title="Cifras dentro da letra">.</button>
  <button class="action" id="toggleSplit" title="Dividir pelo /">*</button>
  <button class="action" id="toggleAutoScroll" title="Rolagem automática — 3 minutos">▶</button>

  <div class="tone-pill">
    Tom atual
    <strong id="currentTone">Bb</strong>
  </div>

</div>
  <div id="tonePanel" class="tone-panel" role="group" aria-label="Tons"></div>
  <div id="autoScrollPanel" class="auto-scroll-panel hidden" aria-label="Velocidade da rolagem automática">
    <label class="memory-check" title="Memorizar o tempo desta música"><input type="checkbox" id="autoScrollMemory"><span>⏱</span></label>
    <button type="button" class="speed-btn" id="autoScrollSlow" title="Mais devagar">−</button>
    <input class="auto-scroll-speed" id="autoScrollSpeed" type="range" min="-5" max="5" step="1" value="0" aria-label="Velocidade da rolagem">
    <span class="auto-scroll-value" id="autoScrollValue">0</span>
    <button type="button" class="speed-btn" id="autoScrollFast" title="Mais rápido">+</button>
    <span class="auto-scroll-label" id="autoScrollTime">3:00</span>
  </div>
</header>
<div class="library-backdrop" id="libraryBackdrop"></div>
<aside class="library-drawer" id="libraryDrawer" aria-hidden="true">
  <div class="library-head"><div class="library-head-row"><div class="library-title">MÚSICAS</div><div class="library-options"><label class="library-check" title="Usar sustenidos"><input type="checkbox" id="toggleSharp">#</label><label class="library-check" title="Entrar meio tom abaixo"><input type="checkbox" id="toggleHalfDown">−½</label></div><button class="library-close" id="closeLibrary">×</button></div><input id="librarySearch" class="library-search" type="search" inputmode="numeric" pattern="[0-9]*" placeholder="🔎  Número do hino..."></div>
  <div class="library-tools"><button id="favoritesFilter">⭐ Favoritos</button><button id="allSongsFilter" class="active">Todas</button></div>
  <div class="library-list" id="libraryList"></div>
</aside>
<main id="score" class="score"><div id="song"></div></main>
<script src="musicas.js"></script>

<script>
const chromatic=[{name:'C'},{name:'Db'},{name:'D'},{name:'Eb'},{name:'E'},{name:'F'},{name:'Gb'},{name:'G'},{name:'Ab'},{name:'A'},{name:'Bb'},{name:'B'}];
/*
  MODELO V21 — posição exata.
  Cada linha agora guarda as cifras como âncoras numéricas:
  anchors:[{pos:0,chord:'Bb'},{pos:18,chord:'F'}, ...]
  pos 0 = antes do primeiro caractere da linha.
  A posição pode cair no meio de uma palavra ou de uma sílaba.
*/

let useSharps=localStorage.getItem('harpa_use_sharps')==='1';
let startHalfDown=localStorage.getItem('harpa_start_half_down')==='1';
function toneMemoryKey(songId){return `harpa_tom_${songId}`}
function loadToneMemory(songId){try{const v=localStorage.getItem(toneMemoryKey(songId));if(v===null)return null;const n=Number(v);return Number.isFinite(n)&&n>=0&&n<12?n:null}catch{return null}}
function getHalfDownIndex(song){
  const i=song.sourceToneIndex;
  const semitones=[1,3,6,8,10]; // Db, Eb, Gb, Ab, Bb
  return semitones.includes(i)?(i+11)%12:i;
}

function getSongStartIndex(songId){
  const song=songs.find(s=>s.id===songId)||songs[0];
  const saved=loadToneMemory(songId);

  if(saved!==null)return saved;

  return startHalfDown
    ? getHalfDownIndex(song)
    : song.sourceToneIndex;
}

let currentSongId='001';let currentIndex=getSongStartIndex(currentSongId);let sectionsHidden=true;let progressionMode=false;let inlineMode=false;let splitMode=false;let autoScrollMode=false;let autoScrollRunning=false;
let autoScrollSpeedLevel=0;
let autoScrollFrame=0;
let autoScrollFadeTimer=0;
let autoScrollSegmentStartTime=0;
let autoScrollSegmentStartY=0;
let autoScrollSegmentDuration=180000;
let autoScrollResumeY=null;let fontScale=.80;
const MIN_FONT_SCALE=.75,MAX_FONT_SCALE=1.35,FONT_STEP=.05;

const aliases={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
function spellNote(note){
  const flat=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const sharp=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const i=aliases[note];
  if(i===undefined)return note;
  return (useSharps?sharp:flat)[i];
}

function transposeChord(chord,semitones){const m=chord.match(/^([A-G](?:#|b)?)(.*)$/);if(!m)return chord;const root=m[1],suffix=m[2]||'';if(!(root in aliases))return chord;return spellNote((['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'])[(aliases[root]+semitones+120)%12])+suffix}
function chordToProgression(chord,keyName){const m=chord.match(/^([A-G](?:#|b)?)(.*)$/);if(!m)return '('+chord+')';const root=m[1],suffix=m[2]||'',scale=[0,2,4,5,7,9,11],key=aliases[keyName],r=aliases[root];if(key===undefined||r===undefined)return '('+chord+')';const interval=(r-key+12)%12,degree=scale.indexOf(interval);let degreeText;if(degree>=0)degreeText=String(degree+1);else{const nearest=scale.reduce((best,val,i)=>{const d=Math.min((interval-val+12)%12,(val-interval+12)%12);return !best||d<best.d?{d,i,dir:((interval-val+12)%12)<=( (val-interval+12)%12)?1:-1}:best},null);degreeText=nearest?(nearest.dir<0?'♭':'♯')+(nearest.i+1):String(interval)}const ext=[];if(/7/.test(suffix))ext.push('7');if(/4/.test(suffix)&&!/7/.test(suffix))ext.push('4');return ext.length?`${degreeText},${ext.join(',')}`:`${degreeText}`}
function applyFontScale(){document.getElementById('score').style.setProperty('--font-scale',fontScale.toFixed(2));document.getElementById('fontDown').disabled=fontScale<=MIN_FONT_SCALE+.001;document.getElementById('fontUp').disabled=fontScale>=MAX_FONT_SCALE-.001}

/*
  Âncoras por posição: não procura palavras; usa diretamente o índice fornecido.
  Ex.: {pos:11,chord:'F'} coloca o acorde exatamente antes do caractere 11.
  A posição fica presa ao texto e acompanha qualquer alteração de fonte/largura.
*/
function normalizeAnchors(lyric,anchors){return [...anchors].sort((a,b)=>a.pos-b.pos).map(a=>({pos:Math.max(0,Math.min(Number(a.pos),lyric.length)),chord:a.chord}))}
function renderInlineFromAnchors(lyric,anchors){const frag=document.createDocumentFragment();let cursor=0;normalizeAnchors(lyric,anchors).forEach(a=>{if(a.pos>cursor)frag.appendChild(document.createTextNode(lyric.slice(cursor,a.pos)));const chord=document.createElement('strong');chord.className='inline-chord';chord.textContent='('+a.chord+')';frag.appendChild(chord);cursor=a.pos});if(cursor<lyric.length)frag.appendChild(document.createTextNode(lyric.slice(cursor)));return frag}
function renderAlignedFromAnchors(lyric,anchors){
  const wrap=document.createElement('div');
  wrap.className='aligned-wrap';

  const line=document.createElement('div');
  line.className='aligned-line';

  let cursor=0;
  const aa=normalizeAnchors(lyric,anchors);

  aa.forEach((a,i)=>{
    if(a.pos>cursor){
      const plain=document.createElement('span');
      plain.className='plain-segment';
      plain.textContent=lyric.slice(cursor,a.pos);
      line.appendChild(plain);
    }

    const group=document.createElement('span');
    group.className='chord-group';

    const label=document.createElement('span');
    label.className='chord-label';
    label.textContent=a.chord;

    const nextPos=i+1<aa.length?aa[i+1].pos:lyric.length;

    const text=document.createElement('span');
    text.className='chord-text';
    text.textContent=lyric.slice(a.pos,nextPos);

    group.append(label,text);
    line.appendChild(group);
    cursor=nextPos;
  });

  if(cursor<lyric.length){
    const plain=document.createElement('span');
    plain.className='plain-segment';
    plain.textContent=lyric.slice(cursor);
    line.appendChild(plain);
  }

  /* Indicador de cifra que ficou fora da área visível */
  const indicator=document.createElement('span');
  indicator.className='overflow-chord-indicator';

  const updateOverflowIndicator=()=>{
    indicator.style.display='none';

    const wrapRect=wrap.getBoundingClientRect();
    const groups=[...line.querySelectorAll('.chord-group')];

    const hiddenChords=[];
    let primeiraOverflow=-1;

    /*
      A plaquinha também é um limite real.
      1ª cifra: chega ao limite da tela.
      Depois que a plaquinha aparece, as próximas são
      calculadas em relação à borda ESQUERDA dela:
        2ª = 20 px antes da plaquinha
        3ª = 30 px antes
        4ª = 40 px antes
        etc.

      Assim a cifra não precisa atravessar a plaquinha
      para ser considerada escondida.
    */
    groups.forEach((group,i)=>{
      const label=group.querySelector('.chord-label');
      if(!label) return;

      const rect=label.getBoundingClientRect();

      /* Primeira cifra: começa a sair pela borda direita visível. */
      if(primeiraOverflow===-1 && rect.right > wrapRect.right + 1){
        primeiraOverflow=i;
      }

      if(primeiraOverflow!==-1){
        const ordem=i-primeiraOverflow;

        if(ordem===0){
          const chord=label.textContent?.trim();
          if(chord) hiddenChords.push(chord);

          /* Mede a plaquinha imediatamente após inserir a primeira cifra. */
          indicator.textContent=hiddenChords.join(', ');
          indicator.style.display='flex';
        }else{
          const indicatorRect=indicator.getBoundingClientRect();

          const distancia=20+(ordem-1)*10;
          const limite=indicatorRect.left-distancia;

          if(rect.right >= limite){
            const chord=label.textContent?.trim();
            if(chord) hiddenChords.push(chord);
            indicator.textContent=hiddenChords.join(', ');
          }
        }
      }
    });

    if(hiddenChords.length){
      indicator.style.display='flex';
    }else{
      indicator.style.display='none';
    }
  };

  wrap.appendChild(line);
  wrap.appendChild(indicator);

  /* Aguarda a largura real da linha antes de verificar o corte. */
  requestAnimationFrame(updateOverflowIndicator);

  if(typeof ResizeObserver!=='undefined'){
    const observer=new ResizeObserver(updateOverflowIndicator);
    observer.observe(wrap);
    observer.observe(line);
    wrap._overflowObserver=observer;
  }

  wrap.addEventListener('scroll',updateOverflowIndicator,{passive:true});

  return wrap;
}
function splitLineAtSlash(lyric,anchors){
  const slash=lyric.indexOf('/');
  if(slash===-1)return null;

  const leftRaw=lyric.slice(0,slash);
  const rightRaw=lyric.slice(slash+1);

  /*
    Remove apenas o espaço que normalmente fica antes/depois do "/".
    O espaço inicial da segunda parte é preservado quando existir.
  */
  const left=leftRaw.replace(/\s+$/,'');
  const right=rightRaw.replace(/^\s+/,' ');

  const cut=slash;

  const leftAnchors=[];
  const rightAnchors=[];

  normalizeAnchors(lyric,anchors).forEach(a=>{
    if(a.pos<cut){
      leftAnchors.push({pos:a.pos,chord:a.chord});
    }else if(a.pos>cut){
      const posInRight=a.pos-(cut+1);
      rightAnchors.push({pos:Math.max(0,posInRight),chord:a.chord});
    }else{
      /*
        Uma cifra exatamente sobre o "/" pertence à segunda parte.
      */
      rightAnchors.push({pos:0,chord:a.chord});
    }
  });

  return {
    leftLyric:left,
    leftAnchors,
    rightLyric:right,
    rightAnchors
  };
}

function isChorusSection(section){return /^(coro|refrão)$/i.test(String(section?.label||'').trim())}
function isVerseSection(section){return /^\s*\d+ª?\s*estrofe/i.test(String(section?.label||''))}
function getAutoScrollSections(sections){
  const choruses=sections.filter(isChorusSection);
  if(!choruses.length)return sections;
  const result=[];
  sections.forEach(section=>{
    if(isChorusSection(section))return;
    result.push(section);
    if(isVerseSection(section))choruses.forEach(chorus=>result.push(chorus));
  });
  return result.length?result:sections;
}
function getAutoScrollMax(){return Math.max(0,document.documentElement.scrollHeight-window.innerHeight)}
function getAutoScrollMultiplier(){return Math.pow(1.15,autoScrollSpeedLevel)}
function getAutoScrollDurationMs(){return 180000/getAutoScrollMultiplier()}
function formatAutoScrollTime(ms){const total=Math.max(1,Math.round(ms/1000));const minutes=Math.floor(total/60);const seconds=total%60;return `${minutes}:${String(seconds).padStart(2,'0')}`}
function autoScrollMemoryKey(songId){return `harpa_scroll_tempo_${songId}`}
function loadAutoScrollMemory(songId){const raw=safeGet(autoScrollMemoryKey(songId),null);const n=raw===null?0:Number(raw);return Number.isFinite(n)?Math.max(-5,Math.min(5,n)):0}
function isAutoScrollMemorySaved(){return String(safeGet(autoScrollMemoryKey(currentSongId),'__none__'))===String(autoScrollSpeedLevel)}
function updateAutoScrollMemoryButton(){
  const checkbox=document.getElementById('autoScrollMemory');
  if(!checkbox)return;
  checkbox.checked=isAutoScrollMemorySaved();
  checkbox.title=checkbox.checked?'Tempo memorizado para esta música':'Memorizar o tempo desta música';
}
function updateAutoScrollPanel(){
  const panel=document.getElementById('autoScrollPanel');
  const value=document.getElementById('autoScrollValue');
  const range=document.getElementById('autoScrollSpeed');
  const time=document.getElementById('autoScrollTime');
  if(range)range.value=String(autoScrollSpeedLevel);
  if(value)value.textContent=autoScrollSpeedLevel>0?`+${autoScrollSpeedLevel}`:String(autoScrollSpeedLevel);
  if(time)time.textContent=formatAutoScrollTime(getAutoScrollDurationMs());
  updateAutoScrollMemoryButton();
  const button=document.getElementById('toggleAutoScroll');
  if(button){
    button.classList.toggle('active',autoScrollMode);
    button.textContent=autoScrollRunning?'⏸':'▶';
    button.title=autoScrollRunning?'Parar rolagem automática':'Rolagem automática';
  }
}
function cancelAutoScrollFrame(){
  if(autoScrollFrame){cancelAnimationFrame(autoScrollFrame);autoScrollFrame=0;}
}
function resetAutoScrollForNewSong(){
  cancelAutoScrollFrame();
  clearTimeout(autoScrollFadeTimer);
  autoScrollFadeTimer=0;

  autoScrollRunning=false;
  autoScrollMode=false;
  autoScrollResumeY=null;

  const panel=document.getElementById('autoScrollPanel');
  if(panel){
    panel.classList.add('hidden');
    panel.classList.remove('fade-50');
  }

  updateAutoScrollPanel();
}
/* =========================================================
   FIM DA ROLAGEM
   Mantém a visualização própria da rolagem no final.
   ========================================================= */

function finishAutoScroll(){

  // Para apenas a animação
  cancelAutoScrollFrame();

  // A rolagem terminou, mas continua no modo de rolagem
  autoScrollRunning=false;
  autoScrollMode=true;

  // Não há mais posição para retomar
  autoScrollResumeY=null;

  // Garante que fique exatamente no final
  window.scrollTo(0,getAutoScrollMax());

  // Mantém a plaquinha visível e atualiza o botão para ▶
  updateAutoScrollPanel();

  // IMPORTANTE:
  // Não esconder a plaquinha
  // Não remover fade-50
  // Não chamar render()
  //
  // Assim a visualização continua exatamente
  // como estava no modo de rolagem.
}
function autoScrollTick(now){
  if(!autoScrollRunning)return;
  const maxY=getAutoScrollMax();
  const elapsed=now-autoScrollSegmentStartTime;
  const p=Math.min(1,elapsed/Math.max(1,autoScrollSegmentDuration));
  const y=autoScrollSegmentStartY+(maxY-autoScrollSegmentStartY)*p;
  window.scrollTo(0,y);
  if(p>=1){finishAutoScroll();return;}
  autoScrollFrame=requestAnimationFrame(autoScrollTick);
}
function startAutoScroll(){
  const panel=document.getElementById('autoScrollPanel');

  if(panel){
    clearTimeout(autoScrollFadeTimer);
    panel.classList.remove('hidden','fade-50');

    autoScrollFadeTimer=setTimeout(()=>{
      if(autoScrollRunning)panel.classList.add('fade-50');
    },5000);
  }

  cancelAutoScrollFrame();
  const retomando=autoScrollResumeY!==null;
  autoScrollMode=true;
  autoScrollRunning=true;

  const notesButton=document.getElementById('toggleNotes');
  const tonePanel=document.getElementById('tonePanel');
  if(notesButton && tonePanel && !tonePanel.classList.contains('hidden')) notesButton.click();

  updateAutoScrollPanel();
  if(!retomando) render();

  requestAnimationFrame(()=>{
    const maxY=getAutoScrollMax();
    if(maxY<=0){finishAutoScroll();return;}
    const startY=retomando?Math.min(autoScrollResumeY,maxY):0;
    autoScrollSegmentStartY=startY;
    autoScrollSegmentStartTime=performance.now();
    autoScrollSegmentDuration=getAutoScrollDurationMs()*Math.max(0,(maxY-startY)/maxY);
    autoScrollResumeY=null;
    window.scrollTo(0,startY);
    autoScrollFrame=requestAnimationFrame(autoScrollTick);
  });
}
function stopAutoScroll(){
  autoScrollResumeY=window.scrollY;
  cancelAutoScrollFrame();
  autoScrollRunning=false;
  autoScrollMode=true;
  updateAutoScrollPanel();
}
function setAutoScrollSpeed(level){
  const next=Math.max(-5,Math.min(5,Number(level)||0));
  if(next===autoScrollSpeedLevel){updateAutoScrollPanel();return;}
  if(autoScrollRunning){
    const now=performance.now();
    const maxY=getAutoScrollMax();
    const currentY=Math.min(window.scrollY,maxY);
    const remaining=Math.max(0,maxY-currentY);
    const remainingRatio=maxY>0?remaining/maxY:0;
    autoScrollSpeedLevel=next;
    autoScrollSegmentStartY=currentY;
    autoScrollSegmentStartTime=now;
    autoScrollSegmentDuration=getAutoScrollDurationMs()*remainingRatio;
  }else{
    autoScrollSpeedLevel=next;
  }
  updateAutoScrollPanel();
}

function getCurrentSong(){return songs.find(s=>s.id===currentSongId)||songs[0]}
function render(){
  const s=getCurrentSong(),delta=currentIndex-s.sourceToneIndex,current=spellNote(chromatic[currentIndex].name);
  document.getElementById('currentTone').textContent=current;
  document.getElementById('currentSongLabel').innerHTML=`<strong>${s.number} — ${s.title}</strong><label class="tone-memory-check" title="Memorizar o tom desta música"><input type="checkbox" id="toneMemory"><span>tom</span></label>`;
  const root=document.getElementById('song');
  root.innerHTML='';

  const sectionsToRender=autoScrollMode?getAutoScrollSections(s.sections):s.sections;

  sectionsToRender.forEach(sectionData=>{
    const section=document.createElement('section');
    section.className='stanza'+(/^coro$/i.test(sectionData.label.trim())?' chorus-section':'');

    const label=document.createElement('div');
    label.className='verse-title';
    label.textContent=sectionData.label;
    section.appendChild(label);

    sectionData.lines.forEach(lineData=>{
      const originalAnchors=lineData.anchors.map(a=>({
        ...a,
        chord:progressionMode
          ? chordToProgression(transposeChord(a.chord,delta),current)
          : transposeChord(a.chord,delta)
      }));

      /*
        MODO DIVIDIR:
        Se houver "/", transforma uma linha em duas,
        usando o "/" apenas como referência e nunca o mostra.
      */
      const split=splitMode
        ? splitLineAtSlash(lineData.lyric,originalAnchors)
        : null;

      const parts=split
        ? [
            {lyric:split.leftLyric,anchors:split.leftAnchors},
            {lyric:split.rightLyric,anchors:split.rightAnchors}
          ]
        : [{lyric:lineData.lyric,anchors:originalAnchors}];

      parts.forEach(part=>{
        const line=document.createElement('div');
        line.className='music-line';

        if(inlineMode){
          const lr=document.createElement('div');
          lr.className='lyrics-inline';
          lr.appendChild(renderInlineFromAnchors(part.lyric,part.anchors));
          line.appendChild(lr);
        }else{
          line.appendChild(renderAlignedFromAnchors(part.lyric,part.anchors));
        }

        section.appendChild(line);
      });
    });

    root.appendChild(section);
  });

  document.getElementById('score').classList.toggle('section-markers-hidden',sectionsHidden);

  const sb=document.getElementById('toggleSections');
  sb.classList.toggle('active',sectionsHidden);
  sb.textContent=sectionsHidden?'/':'🎵';
  sb.title=sectionsHidden?'Mostrar marcações':'Ocultar marcações';

  document.getElementById('toggleProgression').classList.toggle('active',progressionMode);
  document.getElementById('toggleInline').classList.toggle('active',inlineMode);
  document.getElementById('toggleSplit').classList.toggle('active',splitMode);
  updateAutoScrollPanel();

  document.querySelectorAll('#tonePanel button').forEach((b,i)=>b.classList.toggle('active',i===currentIndex));
  updateToneMemoryControl();
}

function safeGet(k,f){
  try{
    const v=localStorage.getItem(k);
    return v===null?f:v
  }catch{
    return f
  }
}

function safeSet(k,v){
  try{
    localStorage.setItem(k,v)
  }catch{}
}

function safeRemove(k){
  try{
    localStorage.removeItem(k)
  }catch{}
}

   ========================================================= */

function renderLibrary(){

  const list=document.getElementById('libraryList');

  const q=document
    .getElementById('librarySearch')
    .value
    .trim()
    .toLowerCase();

  const filtered=songs.filter(s=>
    (!q||`${s.number} ${s.title} ${s.category}`
      .toLowerCase()
      .includes(q))
    &&
    (!favoritesOnly||favoriteSongs.has(s.id))
  );

  list.innerHTML='';


  /* Título da seção */
  const lab=document.createElement('div');
  lab.className='library-section-label';
  lab.textContent='Harpa Cristã';
  list.appendChild(lab);


  /* Nenhuma música encontrada */
  if(!filtered.length){

    const e=document.createElement('div');

    e.className='library-empty';

    e.textContent=
      favoritesOnly
      ? 'Nenhuma música favorita.'
      : 'Nenhuma música encontrada.';

    list.appendChild(e);

    return;
  }


  /* =======================================================
     CADA MÚSICA DA BIBLIOTECA
     ======================================================= */

  filtered.forEach(s=>{

    const row=document.createElement('div');

    row.className=
      'song-item'+
      (s.id===currentSongId?' active':'');


    /* Botão principal para abrir a música */
    const open=document.createElement('button');

    open.className='song-open';

    open.innerHTML=
      `<span class="song-number">${s.number}</span>`+
      `<span class="song-name">${s.title}</span>`;


    /* =====================================================
       TROCA DE MÚSICA
       Aqui a rolagem anterior é encerrada primeiro.
       ===================================================== */

    open.onclick=()=>{

      // 1. Para completamente a rolagem da música anterior
      resetAutoScrollForNewSong();

      // 2. Troca a música
      currentSongId=s.id;

      // 3. Define o tom inicial da nova música
      currentIndex=getSongStartIndex(currentSongId);

      // 4. Recupera a velocidade memorizada desta música
      autoScrollSpeedLevel=
        loadAutoScrollMemory(currentSongId);

      // 5. Renderiza a nova música
      render();

      // 6. Garante que a nova música comece no topo
      window.scrollTo(0,0);

      // 7. Atualiza a biblioteca
      renderLibrary();

      // 8. Fecha a biblioteca
      closeLibrary();
    };


    /* =====================================================
       BOTÃO DE FAVORITO
       ===================================================== */

    const fav=document.createElement('button');

    fav.className='song-fav';

    fav.textContent=
      favoriteSongs.has(s.id)
      ? '★'
      : '☆';


    fav.onclick=(e)=>{

      e.stopPropagation();

      if(favoriteSongs.has(s.id)){
        favoriteSongs.delete(s.id)
      }else{
        favoriteSongs.add(s.id)
      }

      saveFav();

      renderLibrary();
    };


    row.append(open,fav);

    list.appendChild(row);
  });
}

    if(el)el.classList.toggle('ocultado',hidden);
  });

  document.getElementById('toggleNotes').textContent=hidden?'🔻':'🔺';
};

openLibraryBtn.onclick=openLibrary;
closeLibraryBtn.onclick=closeLibrary;
libraryBackdrop.onclick=closeLibrary;
librarySearch.oninput=renderLibrary;

favoritesFilter.onclick=()=>{
  favoritesOnly=true;
  favoritesFilter.classList.add('active');
  allSongsFilter.classList.remove('active');
  renderLibrary();
};

allSongsFilter.onclick=()=>{
  favoritesOnly=false;
  favoritesFilter.classList.remove('active');
  allSongsFilter.classList.add('active');
  renderLibrary();
};

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;

  if(e.key==='ArrowLeft'){
    currentIndex=(currentIndex+11)%12;
    render();
  }

  if(e.key==='ArrowRight'){
    currentIndex=(currentIndex+1)%12;
    render();
  }

  if(e.key==='#'){
    e.preventDefault();
    toggleProgression.click();
  }

  if(e.key==='.'){
    e.preventDefault();
    toggleInline.click();
  }

  if(e.key==='*'){
    e.preventDefault();
    toggleSplit.click();
  }

  if(e.key==='-'&&!e.ctrlKey&&!e.metaKey){
    fontDown.click();
  }

  if((e.key==='+'||e.key==='=')&&!e.ctrlKey&&!e.metaKey){
    fontUp.click();
  }

  if(e.key.toLowerCase()==='n'){
    document.getElementById('toggleNotes').click();
  }

  if(e.key==='Escape')closeLibrary();
});

createToneKeys();autoScrollSpeedLevel=loadAutoScrollMemory(currentSongId);applyFontScale();render();renderLibrary();
</script>
</body></html>
