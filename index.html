<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpa Cifrada — Biblioteca v23</title>
<style>

@font-face{
  font-family:'Bahnschrift';
  src:url('fonts/bahnschrift.ttf') format('truetype');
  font-weight:300;
  font-style:normal;
  font-display:swap;
}

:root{
  --bg:#f2eee7;
  --paper:#fffdf9;
  --ink:#25221e;
  --muted:#746e64;
  --accent:#7a4a24;
  --line:#ddd5ca;
  --key:#f8f5ef;
  --key-hover:#ece5da;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
}

.ocultado{
  display:none!important;
}


/* =========================
   BARRA SUPERIOR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:transparent;
  border-bottom:1px solid var(--line);
  box-shadow:0 3px 14px rgba(60,45,30,.06);
  backdrop-filter:none;
}

.toolbar{
  width:min(1500px,100%);
  margin:0 auto;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  background:rgba(255,253,249,.96);
}

button{
  border:1px solid #cec4b7;
  background:var(--key);
  color:var(--ink);
  border-radius:8px;
  padding:8px 9px;
  min-height:34px;
  cursor:pointer;
  font:600 .79rem/1 Arial,sans-serif;
  transition:background .12s,transform .12s,border-color .12s;
}

button:hover,
button:focus-visible{
  background:var(--key-hover);
  transform:translateY(-1px);
  outline:2px solid rgba(184,135,81,.25);
  outline-offset:1px;
}

button:disabled{
  opacity:.38;
  cursor:default;
  transform:none;
}

button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.action{
  padding-inline:10px;
}

.tone-memory-check{
  display:flex;
  align-items:center;
  gap:3px;
  flex:0 0 auto;
  margin-left:2px;
  cursor:pointer;
  user-select:none;
  font:700 .78rem/1 Arial,sans-serif;
  color:var(--ink);
}

.tone-memory-check input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
  cursor:pointer;
}


/* =========================
   ROLAGEM AUTOMÁTICA
========================= */

.auto-scroll-panel{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:6px 12px 8px;
  border-top:1px solid var(--line);
  background:rgba(255,253,249,.98);
}

.auto-scroll-panel.hidden{
  display:none;
}

.auto-scroll-panel.fade-50{                   /*TRANSPARENCIA NA PLACA DE ROLAGEM*/
  background:rgba(255,253,249,.10);
}

.auto-scroll-panel.fade-50 button{
  background:rgba(248,245,239,.50);
  border-color:rgba(206,196,183,.20);
}

.auto-scroll-panel.fade-50 button:hover,
.auto-scroll-panel.fade-50 button:focus-visible{
  background:rgba(236,229,218,.30);
}

.auto-scroll-panel.fade-50 .auto-scroll-speed{
  opacity:.2;
}

.auto-scroll-panel.fade-50 .memory-check,
.auto-scroll-panel.fade-50 .auto-scroll-value,
.auto-scroll-panel.fade-50 .auto-scroll-label{
  opacity:.40;
}

.auto-scroll-panel .memory-check{
  display:flex;
  align-items:center;
  gap:3px;
  font:700 .78rem/1 Arial,sans-serif;
  cursor:pointer;
  user-select:none;
}

.auto-scroll-panel .memory-check input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
}

.auto-scroll-panel .speed-btn{
  min-width:30px;
  min-height:30px;
  padding:4px 8px;
  border-radius:7px;
}

.auto-scroll-speed{
  width:min(220px,42vw);
  accent-color:var(--accent);
  cursor:pointer;
}

.auto-scroll-value{
  min-width:22px;
  text-align:center;
  font:700 .76rem/1 Arial,sans-serif;
  color:var(--muted);
}

.auto-scroll-label{
  margin-left:4px;
  font:600 .72rem/1 Arial,sans-serif;
  color:var(--muted);
  white-space:nowrap;
}


/* =========================
   MÚSICA ATUAL / TOM
========================= */

.current-song{
  min-width:0;
  max-width:320px;
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 1 auto;
  font:600 .82rem/1.1 Arial,sans-serif;
  color:var(--muted);
}

.current-song strong{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--ink);
}

.tone-pill{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
  font:600 .78rem/1 Arial,sans-serif;
  white-space:nowrap;
  color:var(--muted);
}

.tone-pill strong{
  color:var(--accent);
  background:#f0e7da;
  border:1px solid #d8c4ad;
  border-radius:999px;
  padding:6px 9px;
  font-size:.84rem;
}

.tone-panel{
  width:min(1500px,100%);
  margin:0 auto;
  padding:0 14px 7px;
  display:flex;
  align-items:center;
  gap:2px;
  overflow-x:auto;
  overflow-y:hidden;
  max-height:65px;
  opacity:1;
  transition:max-height .2s,opacity .15s,padding .2s;
  background:rgba(255,253,249,.96);
}

.tone-panel.hidden{
  max-height:0;
  opacity:0;
  padding-top:0;
  padding-bottom:0;
  pointer-events:auto;
}

.tone-panel button{
  min-width:35px;
  padding:6px 5px;
}

/* =========================
   BIBLIOTECA
========================= */

.library-backdrop{
  position:fixed;
  inset:0;
  background:rgba(35,29,23,.22);
  z-index:28;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s;
}

.library-backdrop.open{
  opacity:1;
  pointer-events:auto;
}

.library-drawer{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:min(360px,92vw);
  background:rgba(255,253,249,.99);
  border-right:1px solid var(--line);
  box-shadow:10px 0 35px rgba(50,40,30,.16);
  z-index:30;
  transform:translateX(-102%);
  transition:transform .2s;
  display:flex;
  flex-direction:column;
}

.library-drawer.open{
  transform:translateX(0);
}

.library-head{
  padding:18px 18px 12px;
  border-bottom:1px solid var(--line);
}

.library-head-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.library-options{
  display:flex;
  align-items:center;
  gap:10px;
  margin-left:auto;
}

.library-check{
  display:flex;
  align-items:center;
  gap:3px;
  font:700 .78rem/1 Arial,sans-serif;
  cursor:pointer;
  user-select:none;
}

.library-check input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--accent);
}

.library-title{
  font:700 1.05rem/1 Arial,sans-serif;
  letter-spacing:.03em;
}

.library-close{
  min-width:38px;
}

.library-search{
  width:100%;
  border:1px solid #cfc6b9;
  background:#fffdf9;
  color:var(--ink);
  border-radius:9px;
  padding:10px 11px;
  font:500 .9rem/1.2 Arial,sans-serif;
  outline:none;
}

.library-search:focus{
  border-color:var(--accent);
}

/* Esconde a lupa e o texto ao selecionar o campo */
#librarySearch:focus::placeholder{
  color:transparent;
  opacity:0;
}

.library-tools{
  display:flex;
  gap:7px;
  padding:10px 18px 8px;
  border-bottom:1px solid var(--line);
}

/* BOTÕES ESTÉTICA */

.library-tools button{
  flex:1;
  background:#faf7f1;
  color:#302820;
  border:1px solid #d8cbbb;
  border-radius:10px;
  box-shadow:none;
  outline:none;
  transform:none;
}

/* Botão selecionado */
.library-tools button.active,
.library-tools button.active:focus,
.library-tools button.active:focus-visible{
  background:#eee2d1 !important;
  color:#302820 !important;
  border:1px solid #d5b995 !important;
  outline:none !important;
  outline-offset:0;
  box-shadow:none !important;
  transform:none !important;
}

/* Passagem do mouse */
.library-tools button:hover{
  background:#f1e8dc;
  border-color:#cdb18e;
  outline:none;
  transform:none;
}


.library-list{
  overflow:auto;
  padding:8px 8px 18px;
}

.library-section-label{
  padding:12px 10px 7px;
  font:700 .74rem/1 Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--accent);
}

.song-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) 40px;
  align-items:center;
  gap:6px;
  margin:2px 0;
  border:1px solid transparent;
  background:transparent;
  border-radius:9px;
}

/* Destaca a música atualmente selecionada */
.song-item.active {
  background: #efe5d8;
  border-color: #dcc6ad;
}

.song-item {
  display:grid;
  grid-template-columns:minmax(0,1fr) 30px;
  align-items:center;
  gap:2px;
  margin:0px 0;
  border:1px solid transparent;
  background:transparent;
  border-radius:9px;
  min-width:0;
}

.song-open {
  display:grid;
  grid-template-columns:44px minmax(0,1fr) 30px;
  align-items:center;
  gap:5px;

  width:100%;
  min-width:0;
  box-sizing:border-box;

  border:0;
  background:transparent;
  text-align:left;
  padding:6px 5px;
  border-radius:9px;
  transform:none !important;
}

.song-open:hover {
  background:#f6f1e9;
}

.song-open:hover{
  background:#f6f1e9;
}

.song-number {
  font:600 .82rem/1 Bahnschrift;
  color:#a58a70 !important;
  white-space:nowrap;
}

.song-name {
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-family:'Bahnschrift', sans-serif;
  font-size:.84rem;
  font-weight:300;
  line-height:1.2;
  text-align:left;
}

.song-tone {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 28px;
  height: 28px;
  padding: 0;

  border-radius: 50%;
  border: 1px solid #d8c4ad;
  background: #f0e7da;

  color: var(--accent);
  font: 700 .72rem/1 Arial, sans-serif;
  text-align: center;
  flex-shrink: 0;
}

.song-tone.song-tone-small {
  font-size: .67rem;
}

/* Estrela de favoritos: aparência simples */
.song-fav {
  appearance: none !important;
  -webkit-appearance: none !important;

  width: 40px !important;
  min-width: 40px !important;
  height: 40px !important;

  padding: 0 !important;
  margin: 0 !important;

  border: none !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  outline: none !important;

  color: #98702f;
  font-size: 17px;
  cursor: pointer;

  transform: none !important;
}

/* Não criar contorno ao passar o mouse ou clicar */
.song-fav:hover,
.song-fav:focus,
.song-fav:focus-visible,
.song-fav:active {
  border: none !important;
  outline: none !important;
  background: transparent !important;
  box-shadow: none !important;
  transform: none !important;
}

.library-empty{
  padding:20px 12px;
  color:var(--muted);
  font:500 .9rem/1.4 Arial,sans-serif;
}

/* COMPACTAR LISTA NORMAL DA BIBLIOTECA */
.song-item{
  margin:0 !important;
  gap:2px;
}

.song-open{
  min-height:29px !important;
  padding:1px 5px !important;
  gap:4px;
}

/* Reduzir o espaço ocupado pela estrela */
.song-fav{
  width:37px !important;
  min-width:37px !important;
  height:34px !important;
  min-height:34px !important;
}

/* Círculo do tom ligeiramente menor */
.song-tone{
  width:28px;
  height:28px;
}

/* =========================
   PARTITURA / LETRA
========================= */

.score{
  --font-scale:.80;
  width:min(1500px,100%);
  margin:0 auto;
  padding:16px clamp(14px,3vw,44px) 48px;
}

.score.auto-scroll-mode{        /*  EXTRA — MODO DE RECUO INICIAL */
  padding-top:116px;
}

.stanza{
  margin:0 0 7px;
}

.score.section-markers-hidden .verse-title{
  display:none;
}

.stanza.chorus-section{
  font-style:italic;
  font-weight:700;
}

.stanza.chorus-section .verse-title,
.stanza.chorus-section .music-line,
.stanza.chorus-section .aligned-line,
.stanza.chorus-section .plain-segment,
.stanza.chorus-section .chord-group,
.stanza.chorus-section .chord-text,
.stanza.chorus-section .lyrics-inline{
  font-style:italic;
  font-weight:700;
}

.verse-title{
  font:700 .76rem/1 Arial,sans-serif;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:.11em;
  margin:0 0 0px;
}

.music-line{
  margin:0 0 0px;
  padding-left:0;
}

.stanza > .verse-title + .music-line{
  padding-left:3px;                    /* RECUO DA PRIMEIRA LINHA DE CADA ESTROFE */
}

.stanza.chorus-section > .verse-title + .music-line{
  padding-left:0;                      /* CORO SEM RECUO */
}

/* =========================
   CIFRAS ALINHADAS
========================= */

.aligned-wrap{
  position:relative;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:thin;
}

.overflow-chord-indicator{
  position:absolute;
  right:2px;
  top:0px;
  z-index:5;
  display:none;
  align-items:center;
  gap:2px;
  padding:0px 5px 0px 7px;
  border:1px solid #d8c4ad;
  border-radius:6px;
  background:rgba(255,253,249,.50);
  color:#b00000;
  font:800 calc(clamp(.80rem,1.08vw,.95rem)*var(--font-scale))/1 'Courier New',monospace;
  white-space:nowrap;
  box-shadow:-5px 0 8px rgba(255,253,249,.95);
  pointer-events:none;
}

.overflow-chord-indicator::after{
  content:'>';
  color:var(--ink);
  font-weight:900;
}

.aligned-line{
  display:flex;
  align-items:flex-end;
  width:max-content;
  min-width:100%;
  white-space:nowrap;
  font-size:calc(clamp(1.12rem,2vw,1.42rem)*var(--font-scale));
  line-height:1.27;
  padding-top:1.20em;
  overflow:visible;
}

.plain-segment{
  display:inline-block;
  align-self:flex-end;
  flex:0 0 auto;
  line-height:inherit;
  white-space:pre;
}

.chord-group{
  position:relative;
  display:inline-block;
  align-self:flex-end;
  flex:0 0 auto;
  line-height:inherit;
  white-space:pre;
}


/* =========================
   CIFRAS
========================= */

.chord-label{
  position:absolute;
  left:0;
  bottom:100%;
  display:block;
  height:auto;

  color:#b00000;

  font-family:Arial,Helvetica,sans-serif;
  font-size:calc(clamp(.80rem,1.08vw,.95rem)*var(--font-scale));
  font-weight:900;
  line-height:1;

  white-space:nowrap;
  pointer-events:none;
}

.chord-text{
  display:block;
  line-height:inherit;
  white-space:pre;
}


/* =========================
   MODO INLINE
========================= */

.lyrics-inline{
  font-size:calc(clamp(1.12rem,2vw,1.42rem)*var(--font-scale));
  line-height:1.30;
  letter-spacing:.005em;
  max-width:1100px;
  white-space:pre-wrap;
}

.inline-chord{
  color:#c00000;
  font-weight:800;
  font-size:.78em;
  white-space:nowrap;
  vertical-align:baseline;
}

/* =========================================================
   ESTILO DAS CANÇÕES DE LOUVOR — inspirado em cifras online
   ========================================================= */
.score.louvor-mode .aligned-line,
.score.louvor-mode .lyrics-inline{
  font-family:'Courier New',Courier,monospace;
  font-style:normal;
  font-weight:400;
  letter-spacing:0;
}

.score.louvor-mode .chord-label,
.score.louvor-mode .inline-chord{
  color:#ed7b18;
}

.score.louvor-mode .verse-title{
  color:#ed7b18;
}


/* =========================
   CELULAR
========================= */

@media(max-width:760px){

  .toolbar{
    padding:7px 8px;
    gap:4px;
  }

  .current-song{
    order:50;
    max-width:none;
    flex:1 1 100%;
    padding:0 2px 2px;
  }

  .tone-pill{
    margin-left:3px;
  }

  .score{
    padding:14px 10px 38px;
  }

  .aligned-line{
    font-size:calc(1.08rem*var(--font-scale));
    line-height:1.24;
    padding-top:1.16em;
  }

  .chord-label{
    font-size:calc(.80rem*var(--font-scale));
    font-weight:900;
  }

  .lyrics-inline{
    font-size:calc(1.08rem*var(--font-scale));
    line-height:1.26;
  }

/* No celular, letras de Louvor mais compactas */
.score.louvor-mode .aligned-line {
  font-size: calc(1.09rem * var(--font-scale));
  line-height: 1.20;
  letter-spacing: -0.09em;
}

.score.louvor-mode .lyrics-inline {
  font-size: calc(1.09rem * var(--font-scale));
  line-height: 1.22;
  letter-spacing: -0.09em;
}

/* Espaçamento exclusivo das cifras */
.score.louvor-mode .chord-label {
  letter-spacing: 0.04em;
}

  .tone-panel{
    padding-left:8px;
    padding-right:8px;
  }

  .tone-panel button{
    min-width:34px;
    padding:5px 4px;
  }

  .score.louvor-mode .stanza-heading{
    gap:5px;
  }

  .louvor-section-controls{
    gap:2px;
  }

  .louvor-section-controls button{
    width:23px;
    min-width:23px;
    height:23px;
    min-height:23px;
  }

  .louvor-arrangement-dialog{
    max-height:86vh;
    padding:11px;
  }

}

.sequence-builder{
  max-height:65%;
  min-height:220px;
}

/* =========================================================
   PLAQUINHA DE ROLAGEM — AJUSTE PARA CELULAR
   ========================================================= */

@media(max-width:760px){

  .auto-scroll-panel{
    position:relative;
    width:100%;
    max-width:100%;
    padding:6px 30px 7px 8px;
    gap:4px;
    flex-wrap:nowrap;
  }

  .auto-scroll-panel .memory-check{
    flex:0 0 auto;
  }

  .auto-scroll-panel .speed-btn{
    min-width:28px;
    min-height:28px;
    padding:3px 6px;
  }

  .auto-scroll-panel .auto-scroll-speed{
    width:min(125px,35vw);
    min-width:80px;
  }

  .auto-scroll-panel .auto-scroll-value{
    min-width:18px;
    font-size:.70rem;
  }

  .auto-scroll-panel .auto-scroll-label{
    font-size:.68rem;
    margin-left:1px;
  }

  .auto-scroll-panel .auto-scroll-close{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);

    width:22px;
    height:22px;
    min-width:22px;
    min-height:22px;

    padding:0;

    font-size:17px;
    line-height:20px;
  }

  .auto-scroll-panel .auto-scroll-close:hover{
    transform:translateY(-50%);
  }

}



/* TOM ORIGINAL NA FILEIRA DE NOTAS */
.tone-panel button.original-tone:not(.active){
  background:#eee7dc;
  border-color:#cdbda9;
  font-weight:700;
}

/* =========================================================
   APLICATIVOS DA BIBLIOTECA
   ========================================================= */

.library-apps{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
}

.library-app-button{
  width:100%;
  background:#efe5d8;
  border-color:#dcc6ad;
  color:var(--ink);
  font-weight:700;
}

.library-app-button:hover,
.library-app-button:focus-visible{
  background:#e5d7c7;
}

/* APPs */

.library-apps{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  padding:10px 8px;
  border-bottom:1px solid var(--line);
}

.library-app-button{
  width:100%;
  background:#efe5d8;
  border:1px solid #dcc6ad;
  color:var(--ink);
  font-weight:700;
  padding:10px 8px;
  border-radius:9px;
}

.library-app-button:hover,
.library-app-button:focus-visible{
  background:#e5d7c7;
}

.other-apps-menu{
  display:none;
  padding:8px;
  border-bottom:1px solid var(--line);
  gap:6px;
}

.other-apps-menu.aberta{
  display:grid;
}

.other-app-button{
  width:100%;
  background:#f5f0e8;
  border:1px solid #d8cbbb;
  color:var(--ink);
  padding:9px 10px;
  border-radius:8px;
  text-align:left;

/* =========================
   MONTAGEM DA SEQUÊNCIA
========================= */

.library-list{
  flex:1 1 auto;
  min-height:100px;
}

.sequence-builder[hidden]{
  display:none !important;
}

.sequence-builder {
  flex:0 1 65%;
  max-height:65%;
  min-height:240px;
  overflow:auto;
  padding:12px;
  border-top:2px solid var(--line);
  background:#f7f2eb;
}

.sequence-builder-title{
  font-weight:800;
  color:var(--accent);
  margin-bottom:6px;
}

  color:var(--muted);
  line-height:1.4;
  margin-bottom:9px;
}

.sequence-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) 65px auto;
  gap:5px;
  align-items:center;
  padding:7px;
  margin-bottom:5px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fffdf9;

.sequence-item-name{
  font-size:.78rem;
  font-weight:700;
  overflow-wrap:anywhere;
}

.sequence-tone{
  width:65px;
  padding:6px 3px;
  font-size:.78rem;
}

.sequence-item-actions{
  display:flex;
  gap:3px;
}

.sequence-item-actions button{
  min-width:27px;
  min-height:29px;
  padding:3px 5px;
}

.sequence-builder-actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.sequence-builder-actions button{
  flex:1;
  padding:8px 5px;
  font-size:.74rem;

========================= */

<script>
const chromatic=[{name:'C'},{name:'Db'},{name:'D'},{name:'Eb'},{name:'E'},{name:'F'},{name:'Gb'},{name:'G'},{name:'Ab'},{name:'A'},{name:'Bb'},{name:'B'}];

/*
  MODELO V21 — posição exata.
  Cada linha agora guarda as cifras como âncoras numéricas:
  anchors:[{pos:0,chord:'Bb'},{pos:18,chord:'F'}, ...]
  pos 0 = antes do primeiro caractere da linha.
  A posição pode cair no meio de uma palavra ou de uma sílaba.
*/

let useSharps=localStorage.getItem('harpa_use_sharps')==='1';
let startHalfDown=localStorage.getItem('harpa_start_half_down')==='1';
function toneMemoryKey(songId){return `harpa_tom_${songId}`}
function loadToneMemory(songId){try{const v=localStorage.getItem(toneMemoryKey(songId));if(v===null)return null;const n=Number(v);return Number.isFinite(n)&&n>=0&&n<12?n:null}catch{return null}}

// Valida e retorna o índice cromático original da música.
function getSongBaseToneIndex(song){
  const index=Number(song?.sourceToneIndex);

  return Number.isInteger(index) && index>=0 && index<12
    ? index
    : 0;
}

// Monta o nome do tom usando a etiqueta do Criador de Cifras.
function formatSongTone(song,index){
  if(!Number.isInteger(index) || !chromatic[index]){
    return '—';
  }

  return spellNote(chromatic[index].name) +
    (song.sourceToneLabel ? 'm' : '');
}

function getHalfDownIndex(song){
  const i=getSongBaseToneIndex(song);
  const semitones=[1,3,6,8,10];

  return semitones.includes(i)?(i+11)%12:i;
}

function getSongStartIndex(songId){
  const song=songs.find(s=>s.id===songId)||songs[0];
  const saved=loadToneMemory(songId);

  if(saved!==null)return saved;

  return startHalfDown
    ? getHalfDownIndex(song)
    : getSongBaseToneIndex(song);
}

let currentSongId=localStorage.getItem('harpa_current_song')||'001'; // MEMORIZA HINO ABERTO //
let currentIndex=getSongStartIndex(currentSongId);
let sectionsHidden = true;
 // getSongCategory(songs.find(s => s.id === currentSongId) || songs[0]) !== 'Louvor';  (FUNÇÃO INVERTER HIDEM DESATIVADA)
let progressionMode=false;

const MIN_FONT_SCALE=.75,MAX_FONT_SCALE=1.35,FONT_STEP=.05;

const aliases={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
function spellNote(note){
  const flat=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const sharp=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const i=aliases[note];
  if(i===undefined)return note;
  return (useSharps?sharp:flat)[i];
}

function transposeChord(chord,semitones){
  const m=chord.match(/^([A-G](?:#|b)?)(.*?)(?:\/([A-G](?:#|b)?))?$/);

  if(!m)return chord;

  const root=m[1];
  const suffix=m[2]||'';
  const bass=m[3]||'';

  if(!(root in aliases))return chord;

  const notes=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

  const newRoot=spellNote(
    notes[(aliases[root]+semitones+120)%12]
  );

  const newBass=bass
    ? '/'+spellNote(notes[(aliases[bass]+semitones+120)%12])
    : '';

  return newRoot+suffix+newBass;
}

function chordToProgression(chord,keyName){

  const m=chord.match(/^([A-G](?:#|b)?)(.*)$/);

  if(!m)
    return '('+chord+')';

  const root=m[1],
        suffix=m[2]||'',
        scale=[0,2,4,5,7,9,11],
        key=aliases[keyName],
        r=aliases[root];

  if(key===undefined||r===undefined)
    return '('+chord+')';

  const interval=(r-key+12)%12,
        degree=scale.indexOf(interval);

  let degreeText;

  if(degree>=0){

    degreeText=String(degree+1);

  }else{

    const nearest=scale.reduce((best,val,i)=>{

      const d=Math.min(
        (interval-val+12)%12,
        (val-interval+12)%12
      );

      return !best||d<best.d
        ? {
            d,
            i,
            dir:
              ((interval-val+12)%12)
              <=
              ((val-interval+12)%12)
              ?1:-1
          }
        :best;

    },null);

    degreeText=nearest
      ? (nearest.dir<0?"♭":"♯")+(nearest.i+1)
      : String(interval);
  }

  /*
    Detecta acordes menores.

    Exemplos:
    Gm   → 6m
    Am   → 2m
    Cm7  → 4m,7

    Não considera "maj" como menor.
  */
  const acordeMenor=
    /^(?:m(?!aj)|min|-)/i.test(suffix);

  if(acordeMenor){
    degreeText+='m';
  }

  const ext=[];

  if(/7/.test(suffix))
    ext.push('7');

  if(/4/.test(suffix)&&!/7/.test(suffix))
    ext.push('4');

  return ext.length
    ? `${degreeText},${ext.join(',')}`
    : `${degreeText}`;
}
function applyFontScale(){document.getElementById('score').style.setProperty('--font-scale',fontScale.toFixed(2));document.getElementById('fontDown').disabled=fontScale<=MIN_FONT_SCALE+.001;document.getElementById('fontUp').disabled=fontScale>=MAX_FONT_SCALE-.001}

/*
  Âncoras por posição: não procura palavras; usa diretamente o índice fornecido.
  Ex.: {pos:11,chord:'F'} coloca o acorde exatamente antes do caractere 11.
  A posição fica presa ao texto e acompanha qualquer alteração de fonte/largura.
*/
function normalizeAnchors(lyric,anchors){
  return [...(anchors || [])]
    .sort((a,b)=>a.pos-b.pos)
    .map(a=>({
      ...a,
      pos:Math.max(0,Math.min(Number(a.pos),lyric.length)),
      chord:a.chord
    }));
}

function markRepeatChordElement(element,anchor){
  if(!anchor.repeatInstanceId) return;

  element.classList.add('repeat-editable-chord');
  element.dataset.repeatId=String(anchor.repeatInstanceId);
  element.dataset.repeatLine=String(anchor.repeatLineIndex);
  element.dataset.repeatAnchor=String(anchor.repeatAnchorIndex);
  element.dataset.sourceChord=String(anchor.sourceChord || anchor.chord || '');
  element.dataset.originalChord=String(anchor.chord || '');
  element.title='Editar esta cifra somente nesta repetição';
}

function renderInlineFromAnchors(lyric,anchors){
  const frag=document.createDocumentFragment();
  let cursor=0;

  normalizeAnchors(lyric,anchors).forEach(a=>{

    if(a.pos>cursor){
      frag.appendChild(
        document.createTextNode(
          lyric.slice(cursor,a.pos)
        )
      );
    }

    const chord=document.createElement('strong');

    chord.className='inline-chord';
    markRepeatChordElement(chord,a);

    /* TECLADINHO SÓ QUANDO O MODO ESTIVER ATIVO */
    if(keyboardMode){
      chord.classList.add('clickable-chord');

      chord.dataset.chord=a.sourceChord||a.chord;
      chord.setAttribute('role','button');
      chord.setAttribute('tabindex','0');

    chord.textContent='('+a.chord+')';

    frag.appendChild(chord);

    cursor=a.pos;
  });

  if(cursor<lyric.length){
    frag.appendChild(
      document.createTextNode(
        lyric.slice(cursor)
      )
    );
  }

  return frag;
}

    if(a.pos>cursor){
      const plain=document.createElement('span');
      plain.className='plain-segment';
      plain.textContent=lyric.slice(cursor,a.pos);
      line.appendChild(plain);
    }

    const group=document.createElement('span');
    group.className='chord-group';

const label=document.createElement('span');

label.className='chord-label';
markRepeatChordElement(label,a);

label.textContent=a.chord;

    const nextPos=i+1<aa.length?aa[i+1].pos:lyric.length;

    text.textContent = lyric.slice(a.pos, nextPos) || '\u200B';

    group.append(label,text);

    cursor=nextPos;
  });

  if(cursor<lyric.length){
    const plain=document.createElement('span');
    plain.className='plain-segment';
    plain.textContent=lyric.slice(cursor);
    line.appendChild(plain);
  }

  /* Indicador de cifra que ficou fora da área visível */
  const indicator=document.createElement('span');
  indicator.className='overflow-chord-indicator';

  const updateOverflowIndicator=()=>{
    indicator.style.display='none';

    const wrapRect=wrap.getBoundingClientRect();
    const groups=[...line.querySelectorAll('.chord-group')];

    const hiddenChords=[];
    let primeiraOverflow=-1;

    /*
      A plaquinha também é um limite real.
      1ª cifra: chega ao limite da tela.
      Depois que a plaquinha aparece, as próximas são
      calculadas em relação à borda ESQUERDA dela:
        2ª = 20 px antes da plaquinha
        3ª = 30 px antes
        4ª = 40 px antes
        etc.

      Assim a cifra não precisa atravessar a plaquinha
      para ser considerada escondida.
    */
    groups.forEach((group,i)=>{
      const label=group.querySelector('.chord-label');
      if(!label) return;

      const rect=label.getBoundingClientRect();

      /* Primeira cifra: começa a sair pela borda direita visível. */
      if(primeiraOverflow===-1 && rect.right > wrapRect.right + 1){
        primeiraOverflow=i;
      }

      if(primeiraOverflow!==-1){
        const ordem=i-primeiraOverflow;

        if(ordem===0){
          const chord=label.textContent?.trim();
          if(chord) hiddenChords.push(chord);

          /* Mede a plaquinha imediatamente após inserir a primeira cifra. */
          indicator.textContent=hiddenChords.join(', ');
          indicator.style.display='flex';
        }else{
          const indicatorRect=indicator.getBoundingClientRect();

          const distancia=20+(ordem-1)*10;
          const limite=indicatorRect.left-distancia;

          if(rect.right >= limite){
            const chord=label.textContent?.trim();
            if(chord) hiddenChords.push(chord);
            indicator.textContent=hiddenChords.join(', ');
          }
        }
      }
    });

    if(hiddenChords.length){
      indicator.style.display='flex';
    }else{
      indicator.style.display='none';
    }
  };

  wrap.appendChild(line);
  wrap.appendChild(indicator);

  /* Aguarda a largura real da linha antes de verificar o corte. */
  requestAnimationFrame(updateOverflowIndicator);

  if(typeof ResizeObserver!=='undefined'){
    const observer=new ResizeObserver(updateOverflowIndicator);
    observer.observe(wrap);
    observer.observe(line);
    wrap._overflowObserver=observer;
  }

  wrap.addEventListener('scroll',updateOverflowIndicator,{passive:true});

  return wrap;
}

function splitLineAtSlash(lyric,anchors){
  const slash=lyric.indexOf('/');
  if(slash===-1)return null;

  const leftRaw=lyric.slice(0,slash);
  const rightRaw=lyric.slice(slash+1);

  /*
    Remove apenas o espaço que normalmente fica antes/depois do "/".
    O espaço inicial da segunda parte é preservado quando existir.
  */
  const left=leftRaw.replace(/\s+$/,'');
  const right = rightRaw;

  const cut=slash;

  const leftAnchors=[];
  const rightAnchors=[];

  normalizeAnchors(lyric,anchors).forEach(a=>{
    if(a.pos<cut){
      leftAnchors.push({...a,pos:a.pos,chord:a.chord});
    }else if(a.pos>cut){
      const posInRight=a.pos-(cut+1);
      rightAnchors.push({...a,pos:Math.max(0,posInRight),chord:a.chord});
    }else{
      /*
        Uma cifra exatamente sobre o "/" pertence à segunda parte.
      */
      rightAnchors.push({...a,pos:0,chord:a.chord});
    }
  });

  return {
    leftLyric:left,
    leftAnchors,
    rightLyric:right,
    rightAnchors
  };
}

function normalizarNomeSecao(label) {
  return String(label || '')
    .trim()
    .replace(/^\[([\s\S]*?)\]$/, '$1')
    .trim()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

function isChorusSection(section) {
  return normalizarNomeSecao(section?.label) === 'coro';
}

function isVerseSection(section) {
  const label = normalizarNomeSecao(section?.label);

  return /^(?:(?:\d+\s*(?:[ªºao])?\s*)|(?:(?:primeira|segunda|terceira|quarta|quinta|sexta|setima|oitava|nona|decima)\s+))?(?:estrofe|parte)$/.test(label);
}

function isChorusOrRefrainSection(section) {
  const label = normalizarNomeSecao(section?.label);
  return label === 'coro' || label === 'refrao';
}

function getAutoScrollSections(
  sections,
  skipChorusAfterLastVerse = false
) {
  const choruses = sections.filter(isChorusSection);

  if (!choruses.length) return sections;

  let lastVerseIndex = -1;

  sections.forEach((section, index) => {
    if (isVerseSection(section)) {
      lastVerseIndex = index;
    }
  });

  const result = [];

  sections.forEach((section, index) => {
    // O Coro será inserido automaticamente após as estrofes.
    if (isChorusSection(section)) return;

    // Mantém as outras seções na posição original.
    result.push(section);

    if (isVerseSection(section)) {
      // Exceção: não repetir o Coro após a última estrofe.
      if (
        skipChorusAfterLastVerse &&
        index === lastVerseIndex
      ) {
        return;
      }

      choruses.forEach(chorus => result.push(chorus));
    }
  });

  return result.length ? result : sections;
}

function getAutoScrollMax(){return Math.max(0,document.documentElement.scrollHeight-window.innerHeight)}
function getAutoScrollMultiplier(){return Math.pow(1.15,autoScrollSpeedLevel)}
function getSequenceEntryDurationSeconds(entry){
  const seconds=Number(entry?.durationSeconds);
  return Number.isFinite(seconds) && seconds>0 ? Math.round(seconds) : 180;
}

function getSequenceEntrySpeedLevel(entry){
  const level=Number(entry?.speedLevel);
  return Number.isFinite(level)
    ? Math.max(-5,Math.min(5,Math.round(level)))
    : 0;
}

function getSequenceEntryDurationMs(entry){
  const base=getSequenceEntryDurationSeconds(entry)*1000;
  const multiplier=Math.pow(1.15,getSequenceEntrySpeedLevel(entry));
  return base/multiplier;
}

function getSequenceBaseDurationMs(){
  if(!Array.isArray(musicSequence) || !musicSequence.length) return 180000;

  return musicSequence.reduce(
    (total,entry)=>total+getSequenceEntryDurationMs(entry),
    0
  );
}

function formatSequenceDuration(seconds){
  const total=Math.max(1,Math.round(Number(seconds)||0));
  const hours=Math.floor(total/3600);
  const minutes=Math.floor((total%3600)/60);
  const secs=total%60;
  return hours>0
    ? `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`
    : `${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}
function parseSequenceDuration(value){
  const parts=String(value||'').trim().split(':').map(part=>part.trim());
  if(parts.length!==2 && parts.length!==3) return null;
  if(parts.some(part=>!/^\d{1,3}$/.test(part))) return null;
  let seconds;
  if(parts.length===2){
    const [minutes,secs]=parts.map(Number);
    if(secs>59) return null;
    seconds=minutes*60+secs;
  }else{
    const [hours,minutes,secs]=parts.map(Number);
    if(minutes>59 || secs>59) return null;
    seconds=hours*3600+minutes*60+secs;
  }
  return seconds>=5 && seconds<=86400 ? seconds : null;
}
function getAutoScrollDurationMs(){
  const base=sequenceMode && musicSequence.length
    ? getSequenceBaseDurationMs()
    : 180000;
  return base/getAutoScrollMultiplier();
}
function formatAutoScrollTime(ms){const total=Math.max(1,Math.round(ms/1000));const minutes=Math.floor(total/60);const seconds=total%60;return `${minutes}:${String(seconds).padStart(2,'0')}`}

function buildAutoScrollSequenceSegments(maxY){
  const blocks=[...document.querySelectorAll('#song .sequence-song')];
  if(!sequenceMode || !blocks.length) return null;

  const segments=[];
  blocks.forEach((block,index)=>{
    const sequenceIndex=Number(block.dataset.sequenceIndex);
    const entry=musicSequence[sequenceIndex];
    const startY=index===0
      ? 0
      : Math.max(0,blocks[index].getBoundingClientRect().top+window.scrollY);
    const endY=index===blocks.length-1
      ? maxY
      : Math.max(startY,blocks[index+1].getBoundingClientRect().top+window.scrollY);
    if(endY<=startY) return;

    segments.push({
      startY,
      endY,
      durationBaseMs:getSequenceEntryDurationMs(entry)
    });
  });
  return segments.length ? segments : null;
}

function startSequenceScrollSegment(index,startY,now){
  if(!autoScrollSequenceSegments || index>=autoScrollSequenceSegments.length){
    finishAutoScroll();
    return;
  }
  autoScrollSequenceIndex=index;
  const segment=autoScrollSequenceSegments[index];
  const fromY=Math.max(segment.startY,Math.min(startY ?? segment.startY,segment.endY));
  const distance=Math.max(1,segment.endY-segment.startY);
  const remainingRatio=Math.max(0,(segment.endY-fromY)/distance);
  autoScrollSegmentStartY=fromY;
  autoScrollSegmentStartTime=now ?? performance.now();
  autoScrollSegmentDuration=(segment.durationBaseMs/getAutoScrollMultiplier())*remainingRatio;
}

function rebuildRunningSequenceScrollPlan(){
  if(!autoScrollRunning || !sequenceMode) return;
  const currentY=Math.min(window.scrollY,getAutoScrollMax());
  autoScrollSequenceSegments=buildAutoScrollSequenceSegments(getAutoScrollMax());
  if(!autoScrollSequenceSegments) return;
  const index=autoScrollSequenceSegments.findIndex(segment=>currentY<segment.endY);
  if(index<0){
    finishAutoScroll();
    return;
  }
  cancelAutoScrollFrame();
  startSequenceScrollSegment(index,currentY,performance.now());
  autoScrollFrame=requestAnimationFrame(autoScrollTick);
}

function autoScrollTick(now){
  if(!autoScrollRunning)return;

  if(sequenceMode && autoScrollSequenceSegments?.length){
    const segment=autoScrollSequenceSegments[autoScrollSequenceIndex];
    if(!segment){finishAutoScroll();return;}

    const elapsed=now-autoScrollSegmentStartTime;
    const p=Math.min(1,elapsed/Math.max(1,autoScrollSegmentDuration));
    const y=autoScrollSegmentStartY+(segment.endY-autoScrollSegmentStartY)*p;
    window.scrollTo(0,y);

    if(p>=1){
      const nextIndex=autoScrollSequenceIndex+1;
      if(nextIndex>=autoScrollSequenceSegments.length){
        finishAutoScroll();
        return;
      }
      startSequenceScrollSegment(
        nextIndex,
        autoScrollSequenceSegments[nextIndex].startY,
        now
      );
    }

    autoScrollFrame=requestAnimationFrame(autoScrollTick);
    return;
  }

  const maxY=getAutoScrollMax();
  const elapsed=now-autoScrollSegmentStartTime;
  const p=Math.min(1,elapsed/Math.max(1,autoScrollSegmentDuration));
  const y=autoScrollSegmentStartY+(maxY-autoScrollSegmentStartY)*p;
  window.scrollTo(0,y);
  if(p>=1){finishAutoScroll();return;}
  autoScrollFrame=requestAnimationFrame(autoScrollTick);
}

function despertarAutoScrollPanel(inicio = false) {
  const panel = document.getElementById('autoScrollPanel');
  if (!panel) return;

  clearTimeout(autoScrollFadeTimer);

  if (inicio) {
    // No início da rolagem: nitidez completa
    panel.classList.remove('fade-50', 'parcial-rolagem');
  } else {
    // Ao tocar durante a rolagem: visibilidade parcial
    panel.classList.remove('fade-50');
    panel.classList.add('parcial-rolagem');
  }

  autoScrollFadeTimer = setTimeout(() => {
    if (autoScrollMode) {
      panel.classList.remove('parcial-rolagem');
      panel.classList.add('fade-50');
    }
  }, 5000);
}

  const tonePanel=document.getElementById('tonePanel');
  if(notesButton && tonePanel && !tonePanel.classList.contains('hidden')) notesButton.click();

  updateAutoScrollPanel();
  if(!retomando) render();

  requestAnimationFrame(()=>{
    const maxY=getAutoScrollMax();
    if(maxY<=0){finishAutoScroll();return;}
    const startY=retomando?Math.min(autoScrollResumeY,maxY):0;
    autoScrollResumeY=null;

    if(sequenceMode && musicSequence.length){
      autoScrollSequenceSegments=buildAutoScrollSequenceSegments(maxY);
      if(!autoScrollSequenceSegments){finishAutoScroll();return;}
      const index=autoScrollSequenceSegments.findIndex(segment=>startY<segment.endY);
      if(index<0){finishAutoScroll();return;}
      window.scrollTo(0,startY);
      startSequenceScrollSegment(index,startY,performance.now());
    }else{
      autoScrollSequenceSegments=null;
      autoScrollSegmentStartY=startY;
      autoScrollSegmentStartTime=performance.now();
      autoScrollSegmentDuration=getAutoScrollDurationMs()*Math.max(0,(maxY-startY)/maxY);
      window.scrollTo(0,startY);
    }

    autoScrollFrame=requestAnimationFrame(autoScrollTick);
  });
}

function setAutoScrollSpeed(level){
  const next=Math.max(-5,Math.min(5,Number(level)||0));
  if(next===autoScrollSpeedLevel){updateAutoScrollPanel();return;}
  if(autoScrollRunning){
    const now=performance.now();
    const maxY=getAutoScrollMax();
    const currentY=Math.min(window.scrollY,maxY);
    const remaining=Math.max(0,maxY-currentY);
    const remainingRatio=maxY>0?remaining/maxY:0;
    autoScrollSpeedLevel=next;

    if(sequenceMode && autoScrollSequenceSegments?.[autoScrollSequenceIndex]){
      const segment=autoScrollSequenceSegments[autoScrollSequenceIndex];
      const segmentDistance=Math.max(1,segment.endY-segment.startY);
      const segmentRemainingRatio=Math.max(0,(segment.endY-currentY)/segmentDistance);
      autoScrollSegmentStartY=currentY;
      autoScrollSegmentStartTime=now;
      autoScrollSegmentDuration=(segment.durationBaseMs/getAutoScrollMultiplier())*segmentRemainingRatio;
    }else{
      autoScrollSegmentStartY=currentY;
      autoScrollSegmentStartTime=now;
      autoScrollSegmentDuration=getAutoScrollDurationMs()*remainingRatio;
    }
  }else{
    autoScrollSpeedLevel=next;
  }
  updateAutoScrollPanel();
}

function chordRootName(chord){
  const m=String(chord||'').match(/^([A-G](?:#|b)?)/);
  return m?m[1]:'';
}

function closeChordPopup(){
  if(chordPopupState.el)chordPopupState.el.remove();
  chordPopupState.el=null;chordPopupState.anchor=null;
}

function positionChordPopup(){
  const popup=chordPopupState.el,anchor=chordPopupState.anchor;
  if(!popup || !anchor || !document.body.contains(anchor))return closeChordPopup();
  const r=anchor.getBoundingClientRect();
  const pw=popup.offsetWidth,ph=popup.offsetHeight;
  const margin=10;
  let left=Math.max(margin,Math.min(window.innerWidth-pw-margin,r.left));
  let top=r.bottom+8;
  if(top+ph>window.innerHeight-margin)top=r.top-ph-8;
  if(top<margin)top=margin;
  popup.style.left=Math.round(left)+'px';
  popup.style.top=Math.round(top)+'px';
}

function openChordPopup(anchor){

  const chord=(anchor.dataset.chord||anchor.textContent||'')
    .replace(/[()]/g,'')
    .trim();

  if(!chord || /^\d/.test(chord))return;

  if(chordPopupState.anchor===anchor){
    closeChordPopup();
    return;
  }

  closeChordPopup();

  const popup=document.createElement('div');

  popup.className='chord-keyboard-popup';


  /* =====================================================
     NOME DA NOTA
     ===================================================== */

  const noteName=
    solfegeByPc[aliases[chordRootName(chord)]] || '';


  /* =====================================================
     CABEÇALHO
     ===================================================== */

  const head=document.createElement('div');

  head.className='popup-head';

  head.innerHTML=
    `<span>${chord}${noteName?' = '+noteName:''}</span>`;


  const close=document.createElement('button');

  close.type='button';
  close.className='popup-close';
  close.textContent='×';
  close.title='Fechar';

  close.onclick=e=>{
    e.stopPropagation();
    closeChordPopup();
  };

  head.appendChild(close);

  popup.appendChild(head);


  /* =====================================================
     CONTEÚDO DO INSTRUMENTO
     ===================================================== */

  if(violaoMode){

    if(guitar){
      popup.appendChild(guitar);

      const aviso=document.createElement('div');

      aviso.className='popup-help';

      aviso.textContent=
        'Desenho de violão ainda não cadastrado para este acorde.';

      popup.appendChild(aviso);
    }

  }else{

    const manualNotes=chordNotes(chord);

    const pcs=manualNotes.length
      ? manualNotes
      : chordPitchClasses(chord).map(pc=>({
          nota:popupPcNames[pc],
          oitava:1
        }));

    popup.appendChild(
      buildMiniKeyboard(pcs)
    );
  }


  /* =====================================================
     TEXTO INFERIOR

  help.textContent=violaoMode
    ? 'Cordas marcadas = desenho exato do acorde'
    : 'Teclas marcadas = desenho exato do acorde';

    'click',
    e=>e.stopPropagation()
  );


  document.body.appendChild(popup);

  chordPopupState.el=popup;
  chordPopupState.anchor=anchor;

function renderSequenceSong(song,entry,index){

  const toneIndex = getSequenceToneIndex(entry,song);
  const originalTone = Number(song.sourceToneIndex);

  const sourceToneIndex =
    Number.isInteger(originalTone) &&
    originalTone >= 0 &&
    originalTone < 12
      ? originalTone
      : 0;

  const delta = toneIndex-sourceToneIndex;
  const current = spellNote(chromatic[toneIndex].name);
  const category = getSongCategory(song);

  const block = document.createElement('section');
  block.className = 'sequence-song';
  block.dataset.sequenceIndex=String(index);

  if(category === 'Louvor'){
    block.classList.add('louvor-mode');
  }

  if(sectionsHidden && category !== 'Louvor'){
    block.classList.add('section-markers-hidden');
  }

  const heading = document.createElement('div');
  heading.className = 'sequence-song-heading';
  const headingText=document.createElement('span');
  headingText.textContent =
    `${song.number} — ${song.title} | TOM ${current}`;
  heading.appendChild(headingText);

  // O organizador fica disponível para qualquer música da sequência,
  // inclusive os hinos da Harpa Cristã.
  heading.appendChild(createLouvorArrangementLauncher(song,entry));
  const restoreShortcut=createLouvorRestoreQuickButton(song);
  if(restoreShortcut) heading.appendChild(restoreShortcut);
  block.appendChild(heading);

  const arrangement=getLouvorArrangement(song);
  const sectionsToRender=arrangement
    .map((arrangementEntry,arrangementIndex)=>({
      sectionData:getLouvorEntrySection(song,arrangementEntry),
      arrangementEntry,
      arrangementIndex
    }))
    .filter(item=>item.sectionData);

  sectionsToRender.forEach(({sectionData,arrangementEntry})=>{

    const section = document.createElement('section');

    section.className = 'stanza' +
      (isChorusOrRefrainSection(sectionData)
        ? ' chorus-section'
        : '');

    const label = document.createElement('div');
    label.className = 'verse-title';
    label.textContent = String(sectionData.label || '')
      .trim()
      .replace(/^\[([\s\S]*?)\]$/,'$1')
      .trim();

    section.appendChild(label);

    sectionData.lines.forEach((lineData,lineIndex)=>{

      const originalAnchors = (lineData.anchors || []).map(a=>{

        const sourceChord = transposeChord(a.chord,delta);

        return {
          ...a,
          sourceChord,
          chord:progressionMode
            ? chordToProgression(sourceChord,current)
            : sourceChord
        };
      });

      const split = splitMode
        ? splitLineAtSlash(lineData.lyric,originalAnchors)
        : null;

      const parts = split
        ? [
            {lyric:split.leftLyric,anchors:split.leftAnchors},
            {lyric:split.rightLyric,anchors:split.rightAnchors}
          ]
        : [{lyric:lineData.lyric,anchors:originalAnchors}];

      parts.forEach(part=>{

        const line = document.createElement('div');
        line.className = 'music-line';

        if(inlineMode){
          const lr = document.createElement('div');
          lr.className = 'lyrics-inline';
          lr.appendChild(
            renderInlineFromAnchors(part.lyric,part.anchors)
          );
          line.appendChild(lr);
        }else{
          line.appendChild(
            renderAlignedFromAnchors(part.lyric,part.anchors)
          );
        }

        section.appendChild(line);
      });
    });

    block.appendChild(section);
  });

  return block;
}

function renderSequence(){

  root.innerHTML = '';

  score.classList.add('sequence-mode');

/* =========================================================
   ARRANJO PERSONALIZADO DOS LOUVORES
   A música-base permanece intacta em musicas.js.
   Cópias e alterações de cifras são guardadas por música.
   ========================================================= */

let louvorRepeatCounter = 0;

function louvorArrangementKey(song){
  return `harpa_louvor_arrangement_${song.id}`;
}

function cloneLouvorSection(section){
  return {
    label:String(section?.label || ''),
    lines:(section?.lines || []).map(line=>({
      lyric:String(line?.lyric || ''),
      anchors:(line?.anchors || []).map(anchor=>({
        pos:Number(anchor.pos) || 0,
        chord:String(anchor.chord || '')
      }))
    }))
  };
}

function readSavedLouvorArrangement(song){
  try{
    const raw=localStorage.getItem(louvorArrangementKey(song));
    if(!raw) return null;

    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed)) return null;

    return parsed.filter(item=>{
      if(!item || !Number.isInteger(item.sourceIndex)) return false;
      if(!song.sections?.[item.sourceIndex]) return false;
      if(item.copy && (!item.section || !Array.isArray(item.section.lines))) return false;
      return true;
    }).map((item,index)=>({
      id:String(item.id || `louvor-${song.id}-${index}`),
      sourceIndex:item.sourceIndex,
      copy:item.copy === true,
      ...(item.copy ? {section:cloneLouvorSection(item.section)} : {})
    }));
  }catch(error){
    console.warn('Não foi possível carregar o arranjo da música:',error);
    return null;
  }
}


function hasCustomizedArrangement(song){
  try{
    const raw=localStorage.getItem(louvorArrangementKey(song));
    if(raw===null) return false;

    const saved=readSavedLouvorArrangement(song);
    if(!Array.isArray(saved)) return false;

    const originalSections=song.sections || [];
    const isOriginalOrder=
      saved.length===originalSections.length &&
      saved.every((entry,index)=>
        entry.copy!==true &&
        entry.sourceIndex===index
      );

    return !isOriginalOrder;
  }catch(error){
    console.warn('Não foi possível verificar a personalização da música:',error);
    return false;
  }
}

function createLouvorRestoreQuickButton(song){
  if(!hasCustomizedArrangement(song)) return null;

  const button=document.createElement('button');
  button.type='button';
  button.className='louvor-arrangement-restore-quick';
  button.textContent='↺';
  button.title='Restaurar esta música ao formato original';
  button.setAttribute('aria-label','Restaurar esta música ao formato original');

  button.onclick=event=>{
    event.preventDefault();
    event.stopPropagation();
    restoreOriginalLouvorArrangement(song);
  };

  return button;
}

function getLouvorArrangement(song){
  const saved=readSavedLouvorArrangement(song);
  if(saved) return saved;

  return (song.sections || []).map((section,index)=>({
    id:`base-${song.id}-${index}`,
    sourceIndex:index,
    copy:false
  }));
}

function louvorArrangementHistoryKey(song){
  return `${louvorArrangementKey(song)}_undo`;
}

function getLouvorArrangementHistory(song){
  try{
    const history=JSON.parse(localStorage.getItem(louvorArrangementHistoryKey(song)) || '[]');
    return Array.isArray(history) ? history : [];
  }catch(error){
    return [];
  }
}

function updateLouvorUndoButton(song){
  const button=document.querySelector('#louvorArrangementOverlay .louvor-arrangement-undo');
  if(!button) return;
  const available=getLouvorArrangementHistory(song).length>0;
  button.disabled=!available;
  button.title=available ? 'Desfazer a última alteração' : 'Não há alterações para desfazer';
}

function saveLouvorArrangement(song,arrangement){
  try{
    const key=louvorArrangementKey(song);
    const history=getLouvorArrangementHistory(song);
    // Guarda o estado anterior; null representa o arranjo original, sem personalização.
    history.push(localStorage.getItem(key));
    if(history.length>30) history.shift();
    localStorage.setItem(louvorArrangementHistoryKey(song),JSON.stringify(history));
    localStorage.setItem(key,JSON.stringify(arrangement));
    updateLouvorUndoButton(song);
  }catch(error){
    console.error('Não foi possível salvar o arranjo da música:',error);
    alert('Não foi possível salvar o arranjo neste navegador.');
  }
}

function undoLouvorArrangement(song){
  const history=getLouvorArrangementHistory(song);
  if(!history.length) return;

  const previous=history.pop();
  const key=louvorArrangementKey(song);
  try{
    if(previous===null) localStorage.removeItem(key);
    else localStorage.setItem(key,previous);
    localStorage.setItem(louvorArrangementHistoryKey(song),JSON.stringify(history));
    closeChordPopup();
    renderLouvorKeepingScroll();
    renderLouvorArrangementEditor(song);
    updateLouvorUndoButton(song);
  }catch(error){
    console.error('Não foi possível desfazer a alteração:',error);
    alert('Não foi possível desfazer a alteração neste navegador.');
  }
}

// Restaura a ordem e o conteúdo-base das seções, inclusive alterações
// feitas antes de existir o histórico do botão Desfazer.
function restoreOriginalLouvorArrangement(song){
  const confirmed=confirm(
    'Restaurar esta música ao formato original? Repetições, mudanças de ordem e cifras personalizadas serão removidas.'
  );
  if(!confirmed) return;

  try{
    localStorage.removeItem(louvorArrangementKey(song));
    localStorage.removeItem(louvorArrangementHistoryKey(song));
    closeChordPopup();
    renderLouvorKeepingScroll();
    renderLouvorArrangementEditor(song);
    updateLouvorUndoButton(song);
  }catch(error){
    console.error('Não foi possível restaurar a música:',error);
    alert('Não foi possível restaurar o Louvor neste navegador.');
  }
}

function getLouvorEntrySection(song,entry){
  return entry.copy
    ? entry.section
    : song.sections[entry.sourceIndex];
}

function nextLouvorRepeatId(song){
  louvorRepeatCounter++;
  return `repeat-${song.id}-${Date.now()}-${louvorRepeatCounter}`;
}

function renderLouvorKeepingScroll(){
  const x=window.scrollX;
  const y=window.scrollY;
  closeChordPopup();
  render();
  requestAnimationFrame(()=>window.scrollTo(x,y));
}

function createLouvorSectionControls(song,arrangement,index,entry){
  const controls=document.createElement('div');
  controls.className='louvor-section-controls';

  function makeControl(symbol,title,className,callback){
    const button=document.createElement('button');
    button.type='button';
    button.className=className;
    button.textContent=symbol;
    button.title=title;
    button.setAttribute('aria-label',title);
    button.onclick=event=>{
      event.preventDefault();
      event.stopPropagation();
      callback();
    };
    return button;
  }

  const addButton=makeControl('＋','Repetir esta seção','louvor-section-add',()=>{
    const source=getLouvorEntrySection(song,entry);
    if(!source) return;

    const copy={
      id:nextLouvorRepeatId(song),
      sourceIndex:entry.sourceIndex,
      copy:true,
      section:cloneLouvorSection(source)
    };

    arrangement.splice(index+1,0,copy);
    saveLouvorArrangement(song,arrangement);
    renderLouvorKeepingScroll();
    renderLouvorArrangementEditor(song);
  });

  const upButton=makeControl('↑','Mover para cima','louvor-section-move',()=>{
    if(index<=0) return;
    const item=arrangement.splice(index,1)[0];
    arrangement.splice(index-1,0,item);
    saveLouvorArrangement(song,arrangement);
    renderLouvorKeepingScroll();
    renderLouvorArrangementEditor(song);
  });
  upButton.disabled=index===0;

  const downButton=makeControl('↓','Mover para baixo','louvor-section-move',()=>{
    if(index>=arrangement.length-1) return;
    const item=arrangement.splice(index,1)[0];
    arrangement.splice(index+1,0,item);
    saveLouvorArrangement(song,arrangement);
    renderLouvorKeepingScroll();
    renderLouvorArrangementEditor(song);
  });
  downButton.disabled=index===arrangement.length-1;

  const removeButton=makeControl('×','Remover esta ocorrência','louvor-section-remove',()=>{
    if(arrangement.length<=1) return;
    arrangement.splice(index,1);
    saveLouvorArrangement(song,arrangement);
    renderLouvorKeepingScroll();
    renderLouvorArrangementEditor(song);
  });
  removeButton.disabled=arrangement.length<=1;

  controls.append(addButton,upButton,downButton,removeButton);
  return controls;
}

function saveLouvorRepeatedChord(songId,repeatId,lineIndex,anchorIndex,chord){
  const song=songs.find(item=>String(item.id)===String(songId));
  if(!song || getSongCategory(song)!=='Louvor') return false;

  const arrangement=readSavedLouvorArrangement(song);
  if(!arrangement) return false;

  const entry=arrangement.find(item=>item.id===String(repeatId) && item.copy);
  const anchor=entry?.section?.lines?.[lineIndex]?.anchors?.[anchorIndex];
  if(!anchor) return false;

  // O usuário edita a cifra no tom que está vendo; converte de volta
  // para o tom-base antes de salvar, evitando transposição dupla.
  const delta=Number(currentIndex)-Number(song.sourceToneIndex);
  anchor.chord=transposeChord(chord,-delta);
  saveLouvorArrangement(song,arrangement);
  return true;
}

function getSequenceToneIndex(entry,song){
  const selectedTone = Number(entry.toneIndex);

  if(
    Number.isInteger(selectedTone) &&
    selectedTone >= 0 &&
    selectedTone < 12
  ){
    return selectedTone;
  }

  const savedTone = Number(getSongStartIndex(song.id));

  if(
    Number.isInteger(savedTone) &&
    savedTone >= 0 &&
    savedTone < 12
  ){
    return savedTone;
  }

  const originalTone = Number(song.sourceToneIndex);

  return (
    Number.isInteger(originalTone) &&
    originalTone >= 0 &&
    originalTone < 12
  ) ? originalTone : 0;
}

function addSongToSequence(song){
  const defaultTone = Number(getSongStartIndex(song.id));
  const originalTone = Number(song.sourceToneIndex);

  const toneIndex =
    Number.isInteger(defaultTone) && defaultTone >= 0 && defaultTone < 12
      ? defaultTone
      : Number.isInteger(originalTone) && originalTone >= 0 && originalTone < 12
        ? originalTone
        : 0;

  musicSequence.push({
    id:String(song.id),
    toneIndex,
    durationSeconds:180
  });

  saveMusicSequence();
  renderSequenceBuilder();
}

      return button;

function createSequenceTonePicker(entry, song){

  const originalToneIndex = Number(song.sourceToneIndex);
  const selectedTone = getSequenceToneIndex(entry,song);

  const wrap = document.createElement('div');
  wrap.className = 'sequence-tone-picker';

  const trigger = document.createElement('button');
  trigger.type = 'button';
  trigger.className = 'sequence-tone-trigger';
  trigger.textContent = spellNote(chromatic[selectedTone].name) + ' ▾';
  trigger.setAttribute('aria-label','Escolher tom');

  let menu = null;

function handleMenuScroll(event){
  if(menu && !menu.contains(event.target)){
    closeMenu();
  }
}

  function closeMenu(){
    if(!menu) return;

    menu.remove();
    menu = null;

    document.removeEventListener('pointerdown',outsideClick,true);
    window.removeEventListener('resize',closeMenu);
    window.removeEventListener('scroll',handleMenuScroll,true);

    trigger.setAttribute('aria-expanded','false');
  }

  function outsideClick(event){
    if(!wrap.contains(event.target) &&
       !menu?.contains(event.target)){
      closeMenu();
    }
  }

  function openMenu(){

    if(menu){
      closeMenu();
      return;
    }

    menu = document.createElement('div');
    menu.className = 'sequence-tone-menu';

    chromatic.forEach((note,index)=>{

      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'sequence-tone-option';

      const isOriginal = index === originalToneIndex;
      const isSelected = index === Number(entry.toneIndex);

      option.textContent =
        (isSelected ? '✓ ' : '') + spellNote(note.name);

      if(isOriginal){
        option.classList.add('original-tone-option');
        option.title = 'Tom original deste hino';
      }

      option.onclick = event=>{
        event.stopPropagation();

        entry.toneIndex = index;
        saveMusicSequence();

        trigger.textContent =
          spellNote(note.name) + ' ▾';

        closeMenu();
      };

      menu.appendChild(option);
    });

    document.body.appendChild(menu);

    const rect = trigger.getBoundingClientRect();
    const margin = 8;

    const roomBelow = window.innerHeight - rect.bottom - margin;
    const roomAbove = rect.top - margin;

    const openUp =
      roomBelow < 220 && roomAbove > roomBelow;

    const available = openUp ? roomAbove : roomBelow;

    menu.style.maxHeight = Math.max(100,Math.min(260,available)) + 'px';

    const menuHeight = Math.min(menu.scrollHeight,Math.max(100,Math.min(260,available)));

    menu.style.left =
      Math.max(5,Math.min(rect.left,window.innerWidth - 105)) + 'px';

    menu.style.top = openUp
      ? Math.max(5,rect.top - menuHeight - 4) + 'px'
      : Math.min(rect.bottom + 4,window.innerHeight - menuHeight - 5) + 'px';

    document.addEventListener('pointerdown',outsideClick,true);
    window.addEventListener('resize',closeMenu);
    window.addEventListener('scroll',handleMenuScroll,true);

    trigger.setAttribute('aria-expanded','true');
  }

  trigger.onclick = openMenu;

  wrap.appendChild(trigger);

  return wrap;
}

const titleHtml=titleParts.length>1

	//	sectionsHidden = getSongCategory(s) !== 'Louvor'; (FUNÇÃO INVERTER HIDEM DESATIVADA)

/* =========================================================
   CARROSSEL CIRCULAR DOS TONS
   3 cópias permitem movimento infinito para os dois lados.
   ========================================================= */

function createToneKeys(){

  const p=document.getElementById('tonePanel');

  p.innerHTML='';

  for(let copy=0;copy<3;copy++){

    chromatic.forEach((t,i)=>{

      const b=document.createElement('button');

      b.textContent=spellNote(t.name);

      // Índice real da nota
      b.dataset.noteIndex=String(i);

      // Qual das 3 cópias
      b.dataset.toneCopy=String(copy);

      b.onclick=()=>{

        currentIndex=i;

        saveToneIfEnabled();

        render();
      };

      p.appendChild(b);
    });
  }


  /* =======================================================
     RODÍZIO INFINITO
     Quando chega perto de uma extremidade, desloca
     exatamente uma sequência de 12 notas.
     ======================================================= */

  p.addEventListener('scroll',()=>{

    const copyWidth=p.scrollWidth/3;

    if(copyWidth<=p.clientWidth)return;

    // Chegou muito para a esquerda
    if(p.scrollLeft<copyWidth*.5){

      p.scrollLeft+=copyWidth;
    }

    // Chegou muito para a direita
    else if(p.scrollLeft>copyWidth*1.5){

      p.scrollLeft-=copyWidth;
    }

  },{passive:true});
}


/* =========================================================
   ATUALIZAÇÃO DOS NOMES DOS TONS
   (# / ♭)

function updateToneKeyLabels(){

  document
    .querySelectorAll('#tonePanel button')

      const i=Number(b.dataset.noteIndex);

      if(chromatic[i]){

      }

}

function centerOriginalTone(){

  const panel=document.getElementById('tonePanel');

  if(!panel)return;

  const originalIndex=
    getSongBaseToneIndex(getCurrentSong());

  const originalButton=
    panel.querySelector(
      `button[data-note-index="${originalIndex}"][data-tone-copy="1"]`
    );

  if(!originalButton)return;

  requestAnimationFrame(()=>{

    const target=
      originalButton.offsetLeft-
      (panel.clientWidth-originalButton.offsetWidth)/2;

    panel.scrollLeft=Math.max(0,target);

  });
}

   ========================================================= */

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;

  if(e.key==='ArrowLeft'){
    currentIndex=(currentIndex+11)%12;
    render();
  }

  if(e.key==='ArrowRight'){
    currentIndex=(currentIndex+1)%12;
    render();
  }

  if(e.key==='#'){
    e.preventDefault();
    toggleProgression.click();
  }

  if(e.key==='.'){
    e.preventDefault();
    toggleInline.click();
  }

  if(e.key==='*'){
    e.preventDefault();
    toggleSplit.click();
  }

  if(e.key==='-'&&!e.ctrlKey&&!e.metaKey){
    fontDown.click();
  }

  if((e.key==='+'||e.key==='=')&&!e.ctrlKey&&!e.metaKey){
    fontUp.click();
  }

  if(e.key.toLowerCase()==='n'){
    document.getElementById('toggleNotes').click();
  }

  if(e.key==='Escape')closeLibrary();
});
